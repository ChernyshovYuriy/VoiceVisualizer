<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#030810}
#c{display:block}
#info{
  position:absolute;top:16px;right:16px;
  background:linear-gradient(160deg,rgba(17,29,53,0.72),rgba(9,17,34,0.66));
  border:1px solid rgba(148,212,255,0.24);border-radius:18px;padding:18px 22px;
  font-family:'Segoe UI','SF Pro Text',sans-serif;min-width:220px;pointer-events:none;
  backdrop-filter:blur(18px) saturate(128%);
  box-shadow:0 22px 56px rgba(0,0,0,.36),0 0 32px rgba(68,132,193,0.10);
}
#info table{border-collapse:collapse;width:100%}
#info td{padding:5px 0}
.lbl{color:rgba(176,202,231,0.58);font-size:11px;letter-spacing:.45px;text-transform:uppercase;padding-right:16px;white-space:nowrap}
.val{color:#eaf4ff;font-size:15px;font-weight:600}
.val.big{font-size:28px;font-weight:700;color:#f4fbff;letter-spacing:-0.5px}
#dot{position:absolute;top:16px;left:16px;width:8px;height:8px;border-radius:50%;background:#2b3645;transition:background .4s,box-shadow .4s}
#dot.on{background:#3fb950;box-shadow:0 0 10px rgba(63,185,80,.55)}
#tag{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  border:1px solid rgba(132,196,255,0.14);border-radius:14px;padding:8px 18px;
  background:linear-gradient(160deg,rgba(14,24,42,0.56),rgba(9,15,30,0.44));
  backdrop-filter:blur(13px);pointer-events:none;
  font-family:'Segoe UI',sans-serif;font-size:11px;color:rgba(214,233,255,0.55);letter-spacing:.4px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <table>
    <tr><td class="lbl">Note</td><td class="val big" id="v-note">—</td></tr>
    <tr><td class="lbl">Freq</td><td class="val" id="v-freq">— Hz</td></tr>
    <tr><td class="lbl">Volume</td><td class="val" id="v-vol">— dB</td></tr>
    <tr><td class="lbl">Timbre</td><td class="val" id="v-timbre">—</td></tr>
    <tr><td class="lbl">Range</td><td class="val" id="v-range">—</td></tr>
  </table>
</div>
<div id="dot"></div>
<div id="tag">Voice creature — anatomy shaped by pitch, timbre, and resonance</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════
   VOICE CREATURE v3
   Full-pipeline: onset, energy, pitchConf, peaks, histories
   ═══════════════════════════════════════════════════════════ */
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

/* ── Config ──────────────────────────────────────────────── */
const N_TENDRILS = 24;
const TSEG = 20;
const TMAX_LEN = 2.0;
const SPINE_RINGS = 36;
const SPINE_SEGS = 10;
const SPINE_MIN_H = 1.6;
const SPINE_MAX_H = 4.0;
const DUST_N = 400;

/* ═══════════════════════════════════════════════════════════
   AUDIO STATE — now receiving rich data from backend
   ═══════════════════════════════════════════════════════════ */
const A = {
  /* current frame */
  mel: new Float32Array(64),
  pitch: 0, loudness: -80, centroid: 900,
  note: '—', timbre: '—', range: '—',
  onset: 0,           /* NEW: transient strength 0–1 */
  energy: 0,          /* NEW: mean mel energy 0–1 */
  pitchConf: 0,       /* NEW: pitch confidence 0–1 */
  peaks: [],          /* NEW: [{bin, value}, ...] spectral peaks */

  /* temporal histories from backend */
  melHist: [],        /* last 10 mel frames */
  pitchHist: [],      /* last 30 pitch values */
  loudHist: [],       /* last 30 loudness values */
  centroidHist: [],
  onsetHist: [],

  /* derived (computed client-side from histories) */
  vibratoDepth: 0,    /* pitch variance → vibrato intensity */
  loudEnvelope: 0,    /* smoothed loudness trend */
  phraseRising: false, /* is loudness increasing? */
};

/* smoothed display values */
let sPitch=220, sLoud=-80, sCentroid=900;
let pitchNorm=0.5, loudNorm=0, centroidNorm=0.5;
let sOnset=0, sEnergy=0, sPitchConf=0;
let breathPhase=0, transientFlash=0, lastNote='—';

/* per-tendril band energies */
const bandE = new Float32Array(N_TENDRILS);
const sBandE = new Float32Array(N_TENDRILS);
/* per-tendril: is this band near a spectral peak? */
const bandPeakBoost = new Float32Array(N_TENDRILS);

function ingestFrame(d) {
  /* current frame */
  for (let i=0;i<64;i++) A.mel[i] = clamp((d.mel&&d.mel[i])||0,0,1);
  A.pitch = d.pitch||0;
  A.loudness = d.loudness ?? -80;
  A.centroid = d.centroid||900;
  A.note = d.note||'—';
  A.timbre = d.timbre||'—';
  A.range = d.range||'—';
  A.onset = d.onset||0;
  A.energy = d.energy||0;
  A.pitchConf = d.pitchConf||0;
  A.peaks = d.peaks||[];

  /* histories */
  A.melHist = d.melHist||[];
  A.pitchHist = d.pitchHist||[];
  A.loudHist = d.loudHist||[];
  A.centroidHist = d.centroidHist||[];
  A.onsetHist = d.onsetHist||[];

  /* ── derive vibrato from pitch history ─────────────────── */
  if (A.pitchHist.length > 5) {
    const ph = A.pitchHist;
    const n = ph.length;
    let mean=0; for(let i=0;i<n;i++) mean+=ph[i]; mean/=n;
    let variance=0; for(let i=0;i<n;i++) variance+=(ph[i]-mean)**2; variance/=n;
    /* vibrato = normalized pitch variance (high = fast pitch oscillation) */
    A.vibratoDepth = clamp(Math.sqrt(variance) / 30, 0, 1);
  }

  /* ── derive loudness envelope trend ────────────────────── */
  if (A.loudHist.length > 3) {
    const lh = A.loudHist;
    const recent = lh.slice(-5);
    const older = lh.slice(-10, -5);
    const avgRecent = recent.reduce((s,v)=>s+v,0)/recent.length;
    const avgOlder = older.length ? older.reduce((s,v)=>s+v,0)/older.length : avgRecent;
    A.phraseRising = avgRecent > avgOlder + 1;
    A.loudEnvelope = clamp((avgRecent + 60) / 40, 0, 1);
  }

  /* ── smooth values ─────────────────────────────────────── */
  const tp = (A.pitch > 40) ? A.pitch : A.centroid;
  sPitch = lerp(sPitch, tp, 0.15);
  sLoud = lerp(sLoud, A.loudness, 0.15);
  sCentroid = lerp(sCentroid, A.centroid, 0.12);
  sOnset = lerp(sOnset, A.onset, 0.4);
  sEnergy = lerp(sEnergy, A.energy, 0.2);
  sPitchConf = lerp(sPitchConf, A.pitchConf, 0.15);

  pitchNorm = lerp(pitchNorm, clamp((Math.log(clamp(tp,80,1500))-Math.log(80))/(Math.log(1500)-Math.log(80)),0,1), 0.18);
  loudNorm = clamp((sLoud+58)/38, 0, 1);
  centroidNorm = clamp((Math.log(clamp(sCentroid,120,4000))-Math.log(120))/(Math.log(4000)-Math.log(120)),0,1);

  /* ── compute band energies for tendrils ────────────────── */
  const bpb = 64 / N_TENDRILS;
  bandPeakBoost.fill(0);
  for (let b=0;b<N_TENDRILS;b++) {
    let sum=0;
    const s0=Math.floor(b*bpb), s1=Math.floor((b+1)*bpb);
    for (let i=s0;i<s1;i++) sum += A.mel[i];
    bandE[b] = sum/(s1-s0);
    sBandE[b] = lerp(sBandE[b], bandE[b], 0.22);
  }

  /* ── mark tendrils near spectral peaks ─────────────────── */
  for (const pk of A.peaks) {
    const tIdx = Math.floor(pk.bin / bpb);
    if (tIdx >= 0 && tIdx < N_TENDRILS) {
      bandPeakBoost[tIdx] = Math.max(bandPeakBoost[tIdx], pk.value);
    }
  }

  /* transient flash from onset */
  if (A.onset > 0.3) transientFlash = Math.max(transientFlash, A.onset);
  if (A.note !== '—' && A.note !== lastNote) { transientFlash = 1; lastNote = A.note; }
}

/* ═══════════════════════════════════════════════════════════
   THREE.JS SCENE
   ═══════════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030810);
scene.fog = new THREE.FogExp2(0x050d18, 0.04);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 2.0, 5.2);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.4,0); controls.enableDamping=true; controls.dampingFactor=0.06;
controls.enablePan=false; controls.minDistance=2.5; controls.maxDistance=10;
controls.maxPolarAngle=Math.PI*0.52; controls.minPolarAngle=Math.PI*0.1; controls.update();

const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.5, 0.75, 0.72);
composer.addPass(bloom);

/* lights */
scene.add(new THREE.AmbientLight(0x1a2844, 0.35));
scene.add(new THREE.HemisphereLight(0x4488bb, 0x050a12, 0.25));
const kl=new THREE.PointLight(0x88bbff,0.5,12,1.8); kl.position.set(2,4,3); scene.add(kl);
const wl=new THREE.PointLight(0xffaa66,0.25,8,2); wl.position.set(-2,2,-1); scene.add(wl);
const creatureLight=new THREE.PointLight(0xaaddff,0,6,1.5); creatureLight.position.set(0,2,0.5); scene.add(creatureLight);

/* floor */
const fg=new THREE.CircleGeometry(3.5,64); fg.rotateX(-Math.PI/2);
scene.add(new THREE.Mesh(fg,new THREE.MeshBasicMaterial({color:0x0a1420,transparent:true,opacity:0.4,depthWrite:false}))).position.y=-0.02;
for(let i=1;i<=3;i++){
  const r=new THREE.Mesh(new THREE.RingGeometry(i*0.6-0.008,i*0.6+0.008,64),
    new THREE.MeshBasicMaterial({color:0x1a3050,transparent:true,opacity:0.15,side:THREE.DoubleSide,depthWrite:false}));
  r.rotation.x=-Math.PI/2; r.position.y=-0.01; scene.add(r);
}

function hsl(h,s,l){
  h=((h%360)+360)%360; const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};
  return{r:f(0),g:f(8),b:f(4)};
}

/* ═══════════════════════════════════════════════════════════
   SPINE — tapered cylinder mesh + center line
   ═══════════════════════════════════════════════════════════ */
const spineVerts = SPINE_RINGS * SPINE_SEGS;
const sbPos = new Float32Array(spineVerts*3);
const sbCol = new Float32Array(spineVerts*3);
const sbIdx = [];
for(let r=0;r<SPINE_RINGS-1;r++) for(let s=0;s<SPINE_SEGS;s++){
  const a=r*SPINE_SEGS+s, b=a+SPINE_SEGS, c=r*SPINE_SEGS+((s+1)%SPINE_SEGS), d=c+SPINE_SEGS;
  sbIdx.push(a,b,c,c,b,d);
}
const sbGeo=new THREE.BufferGeometry();
sbGeo.setAttribute('position',new THREE.BufferAttribute(sbPos,3));
sbGeo.setAttribute('color',new THREE.BufferAttribute(sbCol,3));
sbGeo.setIndex(sbIdx);
scene.add(new THREE.Mesh(sbGeo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.55,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})));

const slPos=new Float32Array(SPINE_RINGS*3), slCol=new Float32Array(SPINE_RINGS*3);
const slGeo=new THREE.BufferGeometry();
slGeo.setAttribute('position',new THREE.BufferAttribute(slPos,3));
slGeo.setAttribute('color',new THREE.BufferAttribute(slCol,3));
scene.add(new THREE.Line(slGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false})));

const sp=[]; for(let i=0;i<SPINE_RINGS;i++) sp.push({x:0,y:0,z:0});

/* ═══════════════════════════════════════════════════════════
   CORE ORB
   ═══════════════════════════════════════════════════════════ */
const coreOrb=new THREE.Mesh(new THREE.SphereGeometry(0.09,24,24),
  new THREE.MeshBasicMaterial({color:0xbbddff,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(coreOrb);
const coreHalo=new THREE.Mesh(new THREE.SphereGeometry(0.14,24,24),
  new THREE.MeshBasicMaterial({color:0x88bbee,transparent:true,opacity:0.15,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(coreHalo);
const coreInner=new THREE.Mesh(new THREE.SphereGeometry(0.04,16,16),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(coreInner);

/* onset pulse ring */
const pulseRing=new THREE.Mesh(new THREE.RingGeometry(0.08,0.22,48),
  new THREE.MeshBasicMaterial({color:0x88ccff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
pulseRing.rotation.x=-Math.PI/2; pulseRing.position.y=0.02; scene.add(pulseRing);

/* ═══════════════════════════════════════════════════════════
   TENDRILS — 24 arms, 360°, line + glow points
   ═══════════════════════════════════════════════════════════ */
function tColor(i){
  const t=i/N_TENDRILS;
  if(t<0.25)return{r:0.95,g:0.50+t*1.2,b:0.20};  /* amber */
  if(t<0.50)return{r:0.70-t*0.4,g:0.88,b:0.30+t*0.4}; /* gold-green */
  if(t<0.75)return{r:0.25,g:0.60+t*0.3,b:0.85}; /* teal */
  return{r:0.50+t*0.3,g:0.72,b:0.98}; /* ice blue */
}

const tendrils=[];
for(let i=0;i<N_TENDRILS;i++){
  const angle=(i/N_TENDRILS)*Math.PI*2;
  const branchH=0.12+(i%12)/12*0.72;
  const lp=new Float32Array(TSEG*3),lc=new Float32Array(TSEG*3);
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.BufferAttribute(lp,3));
  lg.setAttribute('color',new THREE.BufferAttribute(lc,3));
  const lm=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false});
  scene.add(new THREE.Line(lg,lm));

  const pp=new Float32Array(TSEG*3),pc=new Float32Array(TSEG*3);
  const pg=new THREE.BufferGeometry();
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
  const pm=new THREE.PointsMaterial({size:0.055,vertexColors:true,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  scene.add(new THREE.Points(pg,pm));

  tendrils.push({lg,lp,lc,lm,pg,pp,pc,pm, band:i, angle, branchH, phase:i*1.3+Math.random()*0.5, bc:tColor(i)});
}

/* ═══════════════════════════════════════════════════════════
   DUST
   ═══════════════════════════════════════════════════════════ */
const dPos=new Float32Array(DUST_N*3),dCol=new Float32Array(DUST_N*3);
const dPh=new Float32Array(DUST_N),dRad=new Float32Array(DUST_N),dSpd=new Float32Array(DUST_N),dYB=new Float32Array(DUST_N);
for(let i=0;i<DUST_N;i++){dPh[i]=Math.random()*Math.PI*2;dRad[i]=0.5+Math.random()*2.8;dSpd[i]=0.06+Math.random()*0.2;dYB[i]=Math.random()*3.5}
const dGeo=new THREE.BufferGeometry();
dGeo.setAttribute('position',new THREE.BufferAttribute(dPos,3));
dGeo.setAttribute('color',new THREE.BufferAttribute(dCol,3));
const dMat=new THREE.PointsMaterial({size:0.016,vertexColors:true,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
scene.add(new THREE.Points(dGeo,dMat));

/* ═══════════════════════════════════════════════════════════
   UPDATE — the creature lives
   ═══════════════════════════════════════════════════════════ */
function update(dt, now) {
  breathPhase += dt * (0.8 + loudNorm * 1.2 + sPitchConf * 0.6);
  transientFlash *= 0.86;

  const alive = ss(0.02, 0.22, loudNorm);
  const spH = lerp(SPINE_MIN_H, SPINE_MAX_H, pitchNorm*0.55 + loudNorm*0.45) * alive;
  const bScale = 1 + A.loudEnvelope * 0.12 + Math.sin(breathPhase*1.1)*0.02;

  /* vibrato from real pitch history */
  const vib = A.vibratoDepth * 0.06;
  /* spine stability from pitch confidence */
  const wobbleDamp = 1 - sPitchConf * 0.7;

  /* timbre hue */
  let sHue, sSat, sLit;
  if(centroidNorm<0.25){sHue=220;sSat=0.7;sLit=0.35}
  else if(centroidNorm<0.5){sHue=35;sSat=0.8;sLit=0.5}
  else if(centroidNorm<0.75){sHue=25;sSat=0.85;sLit=0.55}
  else{sHue=45;sSat=0.6;sLit=0.65}

  /* ── spine path ────────────────────────────────────────── */
  for(let i=0;i<SPINE_RINGS;i++){
    const t=i/(SPINE_RINGS-1);
    const y=t*spH*bScale;
    const wx=Math.sin(t*5+breathPhase*1.8)*vib*t + Math.sin(t*2+now*0.0004)*0.015*wobbleDamp;
    const wz=Math.cos(t*4.5+breathPhase*1.4)*vib*t*0.6 + Math.cos(t*1.7+now*0.0003)*0.01*wobbleDamp;
    sp[i].x=wx; sp[i].y=y; sp[i].z=wz;

    const li=i*3;
    slPos[li]=wx; slPos[li+1]=y; slPos[li+2]=wz;
    const glow=ss(0.05,0.85,t)*(0.35+sPitchConf*0.65+transientFlash*0.2);
    const c=hsl(sHue+t*20,sSat,sLit*glow);
    slCol[li]=c.r*glow; slCol[li+1]=c.g*glow; slCol[li+2]=c.b*glow;
  }
  slGeo.attributes.position.needsUpdate=true; slGeo.attributes.color.needsUpdate=true;

  /* spine body mesh */
  for(let ring=0;ring<SPINE_RINGS;ring++){
    const t=ring/(SPINE_RINGS-1);
    const p=sp[ring];
    const radius=(0.05+loudNorm*0.045+sOnset*0.025)*(1-t*0.55)*alive;
    const glow=ss(0,0.8,t)*(0.3+sPitchConf*0.5+transientFlash*0.15);
    const c=hsl(sHue+t*25,sSat*0.9,sLit*0.7*glow);
    for(let s=0;s<SPINE_SEGS;s++){
      const a=(s/SPINE_SEGS)*Math.PI*2;
      const vi=(ring*SPINE_SEGS+s)*3;
      sbPos[vi]=p.x+Math.cos(a)*radius; sbPos[vi+1]=p.y; sbPos[vi+2]=p.z+Math.sin(a)*radius;
      sbCol[vi]=c.r*glow; sbCol[vi+1]=c.g*glow; sbCol[vi+2]=c.b*glow;
    }
  }
  sbGeo.attributes.position.needsUpdate=true; sbGeo.attributes.color.needsUpdate=true;

  /* ── core orb ──────────────────────────────────────────── */
  const tip=sp[SPINE_RINGS-1];
  coreOrb.position.set(tip.x,tip.y,tip.z);
  const os=clamp((0.4+loudNorm*0.7+sPitchConf*0.5+transientFlash*0.3)*alive,0.08,2);
  coreOrb.scale.setScalar(os);
  coreOrb.material.opacity=0.2+sPitchConf*0.5+transientFlash*0.12;
  const oc=hsl(sHue-10,sSat*0.9,0.55+sPitchConf*0.15);
  coreOrb.material.color.setRGB(oc.r,oc.g,oc.b);

  coreHalo.position.copy(coreOrb.position);
  coreHalo.scale.setScalar(os*1.5);
  coreHalo.material.opacity=clamp(0.04+loudNorm*0.1+transientFlash*0.06,0,0.2);

  coreInner.position.copy(coreOrb.position);
  coreInner.scale.setScalar(os*0.5);
  coreInner.material.opacity=0.3+sPitchConf*0.4;

  /* onset pulse ring — driven by real onset data */
  const pulseScale = 1 + (1-sOnset)*1.5 + transientFlash*0.8;
  pulseRing.scale.setScalar(pulseScale);
  pulseRing.material.opacity = sOnset*0.35 + transientFlash*0.2;

  /* creature light */
  creatureLight.position.set(tip.x*0.5,tip.y*0.6,tip.z+0.4);
  creatureLight.intensity = 0.1+loudNorm*0.7+sPitchConf*0.3+transientFlash*0.2;
  creatureLight.color.setHSL((sHue%360)/360,sSat*0.8,0.55);

  /* ── tendrils with temporal flow from melHist ──────────── */
  const hasMelHist = A.melHist.length > 0;
  const bpb = 64/N_TENDRILS;

  for(const td of tendrils){
    const e = sBandE[td.band];
    const peakBoost = bandPeakBoost[td.band];
    const len = Math.max(0.03, e*TMAX_LEN*(1+loudNorm*0.5)*alive);

    /* branch point on spine */
    const si=Math.floor(td.branchH*(SPINE_RINGS-1));
    const bp=sp[si];

    /* angle with breath modulation, more stable when pitchConf is high */
    const ang=td.angle + Math.sin(breathPhase*0.6+td.phase)*0.2*(0.3+sPitchConf*0.7) + Math.sin(now*0.00015+td.phase)*0.08*(1-sPitchConf*0.5);
    const curl=0.2+e*0.5+A.vibratoDepth*0.15;

    for(let s=0;s<TSEG;s++){
      const st=s/(TSEG-1);
      const reach=st*len;
      const droop=st*st*0.1*(1-e*0.4);

      /* temporal flow: if we have mel history, modulate along tendril length */
      let histBoost = 0;
      if (hasMelHist) {
        const histIdx = Math.floor(st * (A.melHist.length-1));
        const frame = A.melHist[clamp(histIdx,0,A.melHist.length-1)];
        if (frame) {
          const binStart = Math.floor(td.band * bpb);
          const binEnd = Math.floor((td.band+1) * bpb);
          let hSum=0; for(let b=binStart;b<binEnd;b++) hSum+=(frame[b]||0);
          histBoost = hSum/(binEnd-binStart);
        }
      }

      const wave=Math.sin(st*3+breathPhase*1.3+td.phase)*curl*st*0.18;
      const lift=reach*0.1*(1-st*0.4)+histBoost*0.08;

      const px=bp.x+Math.cos(ang+wave)*reach;
      const py=bp.y-droop+lift+Math.sin(st*2+breathPhase*0.7)*0.03*e;
      const pz=bp.z+Math.sin(ang+wave)*reach;

      const bi=s*3;
      td.lp[bi]=px; td.lp[bi+1]=py; td.lp[bi+2]=pz;
      td.pp[bi]=px; td.pp[bi+1]=py; td.pp[bi+2]=pz;

      /* color: base + energy boost + peak highlight + temporal flow */
      const fade=(1-st*0.55)*(0.12+e*0.88+transientFlash*0.1);
      const eb=e*0.3+histBoost*0.15;
      const pkGlow = peakBoost * 0.4 * (1-st*0.8);  /* peak tendrils glow brighter */
      td.lc[bi]=(td.bc.r+eb+pkGlow)*fade;
      td.lc[bi+1]=(td.bc.g+eb*0.5+pkGlow*0.8)*fade;
      td.lc[bi+2]=(td.bc.b+eb*0.3+pkGlow*0.6)*fade;
      td.pc[bi]=td.lc[bi]*0.75; td.pc[bi+1]=td.lc[bi+1]*0.75; td.pc[bi+2]=td.lc[bi+2]*0.75;
    }
    td.lg.attributes.position.needsUpdate=true; td.lg.attributes.color.needsUpdate=true;
    td.pg.attributes.position.needsUpdate=true; td.pg.attributes.color.needsUpdate=true;
    td.lm.opacity=0.12+e*0.65+peakBoost*0.15;
    td.pm.opacity=0.06+e*0.4+peakBoost*0.12;
    td.pm.size=0.028+e*0.055+peakBoost*0.02;
  }

  /* ── dust ──────────────────────────────────────────────── */
  const pull=loudNorm*0.25+sPitchConf*0.1;
  for(let i=0;i<DUST_N;i++){
    dPh[i]+=dt*dSpd[i]*(1+loudNorm*0.4);
    const bi=i*3;
    const r=dRad[i]*(1-pull*0.25)+Math.sin(dPh[i]*0.3+i)*0.12;
    dPos[bi]=Math.cos(dPh[i])*r;
    dPos[bi+1]=dYB[i]*alive*bScale+Math.sin(dPh[i]*0.4+i*0.1)*0.12;
    dPos[bi+2]=Math.sin(dPh[i])*r;
    const dist=Math.sqrt(dPos[bi]**2+(dPos[bi+1]-tip.y*0.4)**2+dPos[bi+2]**2);
    const prox=clamp(1-dist/3.2,0,1);
    /* onset flashes scatter dust */
    const scatter=prox*(0.08+loudNorm*0.2+sOnset*0.15);
    const dc=hsl(sHue+(i%30),sSat*0.4,0.3);
    dCol[bi]=dc.r*scatter; dCol[bi+1]=dc.g*scatter; dCol[bi+2]=dc.b*scatter;
  }
  dGeo.attributes.position.needsUpdate=true; dGeo.attributes.color.needsUpdate=true;
  dMat.opacity=0.1+loudNorm*0.22+sOnset*0.06;
  dMat.size=0.012+loudNorm*0.01+sOnset*0.005;

  /* bloom reacts to energy + onset */
  bloom.strength=lerp(bloom.strength,0.3+sPitchConf*0.35+transientFlash*0.2+sOnset*0.1,0.08);
  bloom.radius=lerp(bloom.radius,0.68+sPitchConf*0.18,0.06);
}

/* ── overlay ─────────────────────────────────────────────── */
const eN=document.getElementById('v-note'),eF=document.getElementById('v-freq');
const eV=document.getElementById('v-vol'),eT=document.getElementById('v-timbre'),eR=document.getElementById('v-range');
function updateOverlay(){
  eN.textContent=A.note;
  eF.textContent=A.pitch?A.pitch.toFixed(1)+' Hz':'— Hz';
  const db=sLoud; eV.textContent=db.toFixed(1)+' dB';
  eV.style.color=db>-18?'#f7d089':db>-42?'#95e1c2':'#89c1f0';
  eT.textContent=A.timbre; eR.textContent=A.range;
}

/* ── WS ──────────────────────────────────────────────────── */
const dot=document.getElementById('dot');
function connect(){
  const ws=new WebSocket('ws://localhost:8765');
  ws.onopen=()=>{dot.classList.add('on')};
  ws.onclose=()=>{dot.classList.remove('on');setTimeout(connect,1500)};
  ws.onerror=()=>ws.close();
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}ingestFrame(d);updateOverlay()};
}
connect();

function resize(){
  const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h);composer.setSize(w,h);bloom.resolution.set(w,h);
}
addEventListener('resize',resize);resize();

let lt=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,(now-lt)/1000||0.016);lt=now;
  update(dt,now);
  const dr=now*0.000025;
  camera.position.x=lerp(camera.position.x,Math.sin(dr)*0.5,0.003);
  camera.position.y=lerp(camera.position.y,2.0+Math.cos(dr*0.6)*0.1,0.003);
  controls.update();composer.render();
}
requestAnimationFrame(animate);
</script>
