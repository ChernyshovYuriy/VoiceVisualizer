<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020609}
#c{display:block}
#info{
  position:absolute;top:16px;right:16px;
  background:linear-gradient(160deg,rgba(12,22,42,0.78),rgba(6,12,28,0.72));
  border:1px solid rgba(120,180,240,0.18);border-radius:18px;padding:18px 22px;
  font-family:'Segoe UI','SF Pro Text',sans-serif;min-width:220px;pointer-events:none;
  backdrop-filter:blur(18px) saturate(130%);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
#info table{border-collapse:collapse;width:100%}
#info td{padding:5px 0}
.lbl{color:rgba(160,195,230,0.50);font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding-right:14px;white-space:nowrap}
.val{color:#e0eeff;font-size:15px;font-weight:600}
.val.big{font-size:28px;font-weight:700;color:#f0f8ff;letter-spacing:-0.5px}
#dot{position:absolute;top:16px;left:16px;width:8px;height:8px;border-radius:50%;background:#2b3645;transition:background .4s,box-shadow .4s}
#dot.on{background:#3fb950;box-shadow:0 0 10px rgba(63,185,80,.55)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <table>
    <tr><td class="lbl">Note</td><td class="val big" id="v-note">—</td></tr>
    <tr><td class="lbl">Freq</td><td class="val" id="v-freq">— Hz</td></tr>
    <tr><td class="lbl">Volume</td><td class="val" id="v-vol">— dB</td></tr>
    <tr><td class="lbl">Timbre</td><td class="val" id="v-timbre">—</td></tr>
    <tr><td class="lbl">Range</td><td class="val" id="v-range">—</td></tr>
  </table>
</div>
<div id="dot"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

const SPINE_RINGS=48,SPINE_SEGS=14,SPINE_MIN=1.6,SPINE_MAX=4.2;
const N_BANDS=16;

/*
 * GPU PARTICLE SYSTEM — 360,000 particles, all physics on vertex shader.
 *
 * Three layers:
 *   PLASMA (120K) — tight orbits, fast spin, small bright particles
 *   AURA   (180K) — medium orbits, the body of the creature
 *   WISP   (60K)  — wide slow drifts, atmospheric haze
 *
 * Per-particle attributes (set once at init, never touched again):
 *   aHomeY, aHomeR, aAngVel, aPhase, aBand, aLayer, aSizeBase
 *
 * Uniforms (updated every frame from JS — ~25 values):
 *   uTime, uBands[16], uLoud, uPitchConf, uFlash, uAlive,
 *   uSpineH, uBreath, uVibrato, uOnset, uCentroid
 */
const PLASMA_N=120000, AURA_N=180000, WISP_N=60000;
const TOTAL_P=PLASMA_N+AURA_N+WISP_N;

/* ═══ AUDIO ═══ */
const A={mel:new Float32Array(64),pitch:0,loudness:-80,centroid:900,
  note:'—',timbre:'—',range:'—',onset:0,energy:0,pitchConf:0,peaks:[],
  melHist:[],pitchHist:[],loudHist:[],centroidHist:[],onsetHist:[],
  vibratoDepth:0,loudEnvelope:0,phraseRising:false};

let sPitch=220,sLoud=-80,sCentroid=900,sOnset=0,sEnergy=0,sPitchConf=0;
let pitchNorm=0.5,loudNorm=0,centroidNorm=0.5;
let breathPhase=0,transientFlash=0,lastNote='—';

const bandE=new Float32Array(N_BANDS),sBandE=new Float32Array(N_BANDS),peakBoost=new Float32Array(N_BANDS);

function ingestFrame(d){
  for(let i=0;i<64;i++)A.mel[i]=clamp((d.mel&&d.mel[i])||0,0,1);
  A.pitch=d.pitch||0;A.loudness=d.loudness??-80;A.centroid=d.centroid||900;
  A.note=d.note||'—';A.timbre=d.timbre||'—';A.range=d.range||'—';
  A.onset=d.onset||0;A.energy=d.energy||0;A.pitchConf=d.pitchConf||0;
  A.peaks=d.peaks||[];A.melHist=d.melHist||[];
  A.pitchHist=d.pitchHist||[];A.loudHist=d.loudHist||[];
  A.centroidHist=d.centroidHist||[];A.onsetHist=d.onsetHist||[];
  if(A.pitchHist.length>5){const ph=A.pitchHist,n=ph.length;let m=0;for(let i=0;i<n;i++)m+=ph[i];m/=n;let v=0;for(let i=0;i<n;i++)v+=(ph[i]-m)**2;v/=n;A.vibratoDepth=clamp(Math.sqrt(v)/30,0,1)}
  if(A.loudHist.length>3){const lh=A.loudHist,r=lh.slice(-5),o=lh.slice(-10,-5);const ar=r.reduce((s,v)=>s+v,0)/r.length;const ao=o.length?o.reduce((s,v)=>s+v,0)/o.length:ar;A.phraseRising=ar>ao+1;A.loudEnvelope=clamp((ar+60)/40,0,1)}
  const tp=(A.pitch>40)?A.pitch:A.centroid;
  sPitch=lerp(sPitch,tp,0.15);sLoud=lerp(sLoud,A.loudness,0.15);
  sCentroid=lerp(sCentroid,A.centroid,0.12);sOnset=lerp(sOnset,A.onset,0.4);
  sEnergy=lerp(sEnergy,A.energy,0.2);sPitchConf=lerp(sPitchConf,A.pitchConf,0.15);
  pitchNorm=lerp(pitchNorm,clamp((Math.log(clamp(tp,80,1500))-Math.log(80))/(Math.log(1500)-Math.log(80)),0,1),0.18);
  loudNorm=clamp((sLoud+58)/38,0,1);
  centroidNorm=clamp((Math.log(clamp(sCentroid,120,4000))-Math.log(120))/(Math.log(4000)-Math.log(120)),0,1);
  const bpb=64/N_BANDS;peakBoost.fill(0);
  for(let b=0;b<N_BANDS;b++){let s=0;const s0=Math.floor(b*bpb),s1=Math.floor((b+1)*bpb);for(let i=s0;i<s1;i++)s+=A.mel[i];bandE[b]=s/(s1-s0);sBandE[b]=lerp(sBandE[b],bandE[b],0.22)}
  for(const pk of A.peaks){const ti=Math.floor(pk.bin/bpb);if(ti>=0&&ti<N_BANDS)peakBoost[ti]=Math.max(peakBoost[ti],pk.value)}
  if(A.onset>0.3)transientFlash=Math.max(transientFlash,A.onset);
  if(A.note!=='—'&&A.note!==lastNote){transientFlash=1;lastNote=A.note}
}

/* ═══ THREE.JS ═══ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020609);
scene.fog=new THREE.FogExp2(0x040a14,0.028);

const camera=new THREE.PerspectiveCamera(38,1,0.1,100);
camera.position.set(0,2.2,5.4);
const ctl=new THREE.OrbitControls(camera,renderer.domElement);
ctl.target.set(0,1.4,0);ctl.enableDamping=true;ctl.dampingFactor=0.06;
ctl.enablePan=false;ctl.minDistance=2.5;ctl.maxDistance=10;
ctl.maxPolarAngle=Math.PI*0.52;ctl.minPolarAngle=Math.PI*0.08;ctl.update();

const composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.9,0.55);
composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0x0a1828,0.25));
scene.add(new THREE.HemisphereLight(0x3366aa,0x020408,0.25));
const kl=new THREE.PointLight(0x6699cc,0.4,14,2);kl.position.set(2.5,4.5,3);scene.add(kl);
const wl=new THREE.PointLight(0xcc8844,0.18,8,2);wl.position.set(-2.5,2,-1.5);scene.add(wl);
const cLight=new THREE.PointLight(0x88ccff,0,7,1.5);cLight.position.set(0,2,0.5);scene.add(cLight);
const rimLight=new THREE.PointLight(0x4488cc,0.15,10,2);rimLight.position.set(-1,0.5,4);scene.add(rimLight);
const baseGlowLight=new THREE.PointLight(0x2244aa,0.25,5,2);baseGlowLight.position.set(0,0.1,0);scene.add(baseGlowLight);

function hsl(h,s,l){h=((h%360)+360)%360;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return{r:f(0),g:f(8),b:f(4)}}

/* ═══ GROUND (unchanged) ═══ */
const groundGeo=new THREE.CircleGeometry(5,96);groundGeo.rotateX(-Math.PI/2);
const groundMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,side:THREE.DoubleSide,
  uniforms:{uTime:{value:0},uEnergy:{value:0}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:`uniform float uTime,uEnergy;varying vec3 vP;
    void main(){float d=length(vP.xz);float ring=sin(d*8.0-uTime*0.5)*0.5+0.5;
    float fade=1.0-smoothstep(1.5,4.5,d);float pulse=0.02+uEnergy*0.06;
    float bright=(0.04+ring*0.015+pulse)*fade;
    vec3 col=mix(vec3(0.06,0.12,0.22),vec3(0.1,0.18,0.35),ring*fade);
    col+=vec3(0.03,0.06,0.12)*uEnergy*fade;gl_FragColor=vec4(col,bright*1.2+0.08*fade);}`
});
const ground=new THREE.Mesh(groundGeo,groundMat);ground.position.y=-0.02;scene.add(ground);

(function(){const pts=[];
  for(let r=0.5;r<=4.0;r+=0.7){const segs=64;for(let i=0;i<segs;i++){
    const a0=(i/segs)*Math.PI*2,a1=((i+1)/segs)*Math.PI*2;
    pts.push(Math.cos(a0)*r,-0.015,Math.sin(a0)*r,Math.cos(a1)*r,-0.015,Math.sin(a1)*r);}}
  for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2;pts.push(Math.cos(a)*0.3,-0.015,Math.sin(a)*0.3,Math.cos(a)*4.0,-0.015,Math.sin(a)*4.0)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  scene.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x1a3050,transparent:true,opacity:0.25})));
})();

/* ═══ SPINE (unchanged) ═══ */
const spV=SPINE_RINGS*SPINE_SEGS;
const spPos=new Float32Array(spV*3),spCol=new Float32Array(spV*3);
const spIdx=[];
for(let r=0;r<SPINE_RINGS-1;r++)for(let s=0;s<SPINE_SEGS;s++){
  const a=r*SPINE_SEGS+s,b=a+SPINE_SEGS,c=r*SPINE_SEGS+((s+1)%SPINE_SEGS),d=c+SPINE_SEGS;spIdx.push(a,b,c,c,b,d);}
const spGeo=new THREE.BufferGeometry();
spGeo.setAttribute('position',new THREE.BufferAttribute(spPos,3));
spGeo.setAttribute('color',new THREE.BufferAttribute(spCol,3));
spGeo.setIndex(spIdx);
scene.add(new THREE.Mesh(spGeo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.7,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})));

const spGeo2=new THREE.BufferGeometry();
const sp2Pos=new Float32Array(spV*3),sp2Col=new Float32Array(spV*3);
spGeo2.setAttribute('position',new THREE.BufferAttribute(sp2Pos,3));
spGeo2.setAttribute('color',new THREE.BufferAttribute(sp2Col,3));
spGeo2.setIndex(spIdx);
scene.add(new THREE.Mesh(spGeo2,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.5,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})));

const spinePts=[];for(let i=0;i<SPINE_RINGS;i++)spinePts.push({x:0,y:0,z:0});

/* ═══ CORE ORB (unchanged) ═══ */
const coreOrb=new THREE.Mesh(new THREE.SphereGeometry(0.1,28,28),new THREE.MeshBasicMaterial({color:0xaaddff,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(coreOrb);
const coreHalo=new THREE.Mesh(new THREE.SphereGeometry(0.18,28,28),new THREE.MeshBasicMaterial({color:0x4488cc,transparent:true,opacity:0.12,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(coreHalo);
const coreOuter=new THREE.Mesh(new THREE.SphereGeometry(0.28,28,28),new THREE.MeshBasicMaterial({color:0x223366,transparent:true,opacity:0.06,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(coreOuter);
const coreInner=new THREE.Mesh(new THREE.SphereGeometry(0.04,16,16),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.65,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(coreInner);
const pulseRing=new THREE.Mesh(new THREE.RingGeometry(0.08,0.22,64),new THREE.MeshBasicMaterial({color:0x66aadd,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
pulseRing.rotation.x=-Math.PI/2;pulseRing.position.y=0.02;scene.add(pulseRing);
const baseRing=new THREE.Mesh(new THREE.RingGeometry(0.15,0.55,64),new THREE.MeshBasicMaterial({color:0x2255aa,transparent:true,opacity:0.08,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
baseRing.rotation.x=-Math.PI/2;baseRing.position.y=0.01;scene.add(baseRing);

/* ═══ BACKGROUND NEBULA (unchanged) ═══ */
(function(){
  const nebFS=`uniform float uTime;varying vec2 vUv;
    float n(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){vec2 uv=vUv-0.5;float d=length(uv);
    float v=n(uv*3.0+uTime*0.02)*0.5+n(uv*7.0-uTime*0.015)*0.3;
    float fade=1.0-smoothstep(0.1,0.5,d);float bright=v*fade*0.035;
    vec3 col=mix(vec3(0.08,0.15,0.30),vec3(0.15,0.08,0.25),v);
    gl_FragColor=vec4(col*bright,bright);}`;
  for(let i=0;i<3;i++){
    const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
      uniforms:{uTime:{value:0}},
      vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader:nebFS});
    const p=new THREE.Mesh(new THREE.PlaneGeometry(12,12),m);
    p.position.set((i-1)*3,2.5,-6-i*2);p.rotation.y=(i-1)*0.3;scene.add(p);
  }
})();

/* ═══════════════════════════════════════════════════════════════════════
   GPU PARTICLE CLOUD — 360,000 particles, all physics in vertex shader
   ═══════════════════════════════════════════════════════════════════════ */

const pUniforms = {
  uTime:      {value:0},
  uBands:     {value:new Float32Array(N_BANDS)},
  uPeaks:     {value:new Float32Array(N_BANDS)},
  uLoud:      {value:0},
  uPitchConf: {value:0},
  uFlash:     {value:0},
  uAlive:     {value:0},
  uSpineH:    {value:2.0},
  uBreath:    {value:0},
  uVibrato:   {value:0},
  uOnset:     {value:0},
  uCentroid:  {value:0.5},
};

const PARTICLE_VS = `
  attribute float aHomeY;
  attribute float aHomeR;
  attribute float aAngVel;
  attribute float aPhase;
  attribute float aBand;
  attribute float aLayer;
  attribute float aSizeBase;

  uniform float uTime, uLoud, uPitchConf, uFlash, uAlive, uSpineH;
  uniform float uBreath, uVibrato, uOnset, uCentroid;
  uniform float uBands[${N_BANDS}];
  uniform float uPeaks[${N_BANDS}];

  varying vec3 vColor;
  varying float vAlpha;

  /* cheap hash for per-particle randomness */
  float hash(float n){ return fract(sin(n)*43758.5453); }

  /* HSL to RGB */
  vec3 hsl2rgb(float h, float s, float l){
    float a=s*min(l,1.0-l);
    float r=l-a*max(-1.0,min(min(mod(h/30.0,12.0)-3.0,9.0-mod(h/30.0,12.0)),1.0));
    float g=l-a*max(-1.0,min(min(mod(h/30.0+8.0,12.0)-3.0,9.0-mod(h/30.0+8.0,12.0)),1.0));
    float b=l-a*max(-1.0,min(min(mod(h/30.0+4.0,12.0)-3.0,9.0-mod(h/30.0+4.0,12.0)),1.0));
    return vec3(r,g,b);
  }

  void main(){
    int band = int(aBand);
    float energy = 0.0;
    float peak = 0.0;
    for(int j=0; j<${N_BANDS}; j++){
      if(j==band){ energy=uBands[j]; peak=uPeaks[j]; }
    }
    float layer = aLayer;

    /* orbital speed: energy + confidence boost */
    float spinMul = 1.0 + energy * (layer < 0.5 ? 1.8 : layer < 1.5 ? 1.0 : 0.4);
    float confTighten = 1.0 + uPitchConf * 0.8;
    float breathSway = sin(uBreath * 0.7 + aPhase) * 0.15 * (1.0 - uPitchConf * 0.5);
    float angle = aPhase + (aAngVel * spinMul * confTighten + breathSway) * uTime;

    /* radius: resting + energy expansion + onset burst */
    float expand = energy * (layer < 0.5 ? 0.12 : layer < 1.5 ? 0.5 : 1.4);
    float burst = uFlash * (layer < 0.5 ? 0.08 : layer < 1.5 ? 0.2 : 0.5);
    /* simulate spring rebound with decaying sine */
    float burstOsc = burst * sin(uTime * 4.0 + aPhase * 2.0) * exp(-uTime * 0.3 + aPhase);
    float radius = aHomeR * (0.4 + uAlive * 0.6) + expand + peak * 0.15;
    /* add organic breathing: radius pulses with breath */
    radius += sin(uBreath * 1.1 + aPhase * 3.0 + aHomeY * 6.28) * 0.03 * (0.3 + energy);
    radius = max(0.005, radius);

    /* vertical position */
    float yBase = aHomeY * uSpineH;
    float yLift = energy * (layer < 0.5 ? 0.12 : layer < 1.5 ? 0.3 : 0.45);
    float yVibrato = sin(uTime * 4.0 + aPhase * 3.0) * uVibrato * 0.25;
    float yBreath = sin(uBreath * 0.9 + aHomeY * 4.0) * 0.04 * (0.2 + uPitchConf);
    float y = yBase + yLift + yVibrato + yBreath;

    /* 3D position: orbit around Y axis */
    vec3 pos = vec3(cos(angle) * radius, y, sin(angle) * radius);

    /* slight helical twist: particles at different heights spiral differently */
    float twist = aHomeY * 1.5 + sin(uBreath * 0.5 + aPhase) * 0.3 * energy;
    float ca = cos(twist), sa = sin(twist);
    float nx = pos.x * ca - pos.z * sa;
    float nz = pos.x * sa + pos.z * ca;
    pos.x = nx; pos.z = nz;

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);

    /* size: layer base * energy drive */
    float sizeEnergy = 0.4 + energy * 2.0 + peak * 0.6 + uFlash * 0.25;
    float sz = aSizeBase * sizeEnergy * uAlive;
    if(layer > 1.5) sz *= (0.7 + radius * 0.35); /* wisps grow when far */
    gl_PointSize = sz * (420.0 / (-mv.z));
    gl_Position = projectionMatrix * mv;

    /* ── color ── */
    float bandT = aBand / ${N_BANDS}.0;
    float hue;
    if(bandT < 0.15) hue = 15.0;
    else if(bandT < 0.3) hue = 30.0;
    else if(bandT < 0.45) hue = 48.0;
    else if(bandT < 0.6) hue = 85.0;
    else if(bandT < 0.75) hue = 180.0;
    else if(bandT < 0.88) hue = 210.0;
    else hue = 260.0;
    /* add variation per particle */
    hue += hash(aPhase * 100.0) * 15.0 - 7.5;

    float sat = 0.75 + (layer < 0.5 ? 0.1 : layer < 1.5 ? 0.0 : -0.15);
    float lit = 0.35 + (layer < 0.5 ? 0.15 : layer < 1.5 ? 0.05 : -0.05);

    float brightness = (0.12 + energy * 0.88 + peak * 0.3 + uFlash * 0.1) * uAlive;
    /* proximity glow */
    float prox = layer < 0.5 ? 1.3 : clamp(1.0 - radius * 0.6, 0.2, 1.0);
    brightness *= prox;

    vColor = hsl2rgb(hue, clamp(sat, 0.0, 1.0), clamp(lit, 0.0, 1.0)) * brightness;
    vAlpha = clamp(brightness * (layer < 0.5 ? 1.0 : layer < 1.5 ? 0.8 : 0.5), 0.0, 1.0);
  }
`;

const PARTICLE_FS = `
  varying vec3 vColor;
  varying float vAlpha;
  void main(){
    float d = length(gl_PointCoord - 0.5) * 2.0;
    float core = 1.0 - smoothstep(0.0, 0.25, d);
    float glow = 1.0 - smoothstep(0.0, 1.0, d);
    float alpha = (core * 0.85 + glow * 0.35) * vAlpha;
    alpha = pow(alpha, 1.15);
    if(alpha < 0.003) discard;
    gl_FragColor = vec4(vColor * (core * 1.3 + glow * 0.5), alpha * 0.88);
  }
`;

/* build particle geometry — attributes set once */
const pGeo = new THREE.BufferGeometry();
const aHomeY  = new Float32Array(TOTAL_P);
const aHomeR  = new Float32Array(TOTAL_P);
const aAngVel = new Float32Array(TOTAL_P);
const aPhase  = new Float32Array(TOTAL_P);
const aBand   = new Float32Array(TOTAL_P);
const aLayer  = new Float32Array(TOTAL_P);
const aSizeB  = new Float32Array(TOTAL_P);
/* dummy position (shader computes real position) */
const aPos    = new Float32Array(TOTAL_P * 3);

function rng(){ return Math.random(); }

let idx=0;
/* PLASMA */
for(let i=0;i<PLASMA_N;i++,idx++){
  aLayer[idx]=0; aBand[idx]=Math.floor(rng()*N_BANDS);
  aPhase[idx]=rng()*6.2832;
  aHomeY[idx]=(aBand[idx]+rng())/N_BANDS;
  aHomeR[idx]=0.03+rng()*0.14;
  aAngVel[idx]=(1.2+rng()*3.0)*(rng()<0.5?1:-1);
  aSizeB[idx]=0.018+rng()*0.022;
}
/* AURA */
for(let i=0;i<AURA_N;i++,idx++){
  aLayer[idx]=1; aBand[idx]=Math.floor(rng()*N_BANDS);
  aPhase[idx]=rng()*6.2832;
  aHomeY[idx]=(aBand[idx]+rng())/N_BANDS;
  aHomeR[idx]=0.12+rng()*0.55;
  aAngVel[idx]=(0.3+rng()*1.4)*(rng()<0.5?1:-1);
  aSizeB[idx]=0.028+rng()*0.035;
}
/* WISP */
for(let i=0;i<WISP_N;i++,idx++){
  aLayer[idx]=2; aBand[idx]=Math.floor(rng()*N_BANDS);
  aPhase[idx]=rng()*6.2832;
  aHomeY[idx]=(aBand[idx]+rng())/N_BANDS;
  aHomeR[idx]=0.45+rng()*1.4;
  aAngVel[idx]=(0.06+rng()*0.35)*(rng()<0.5?1:-1);
  aSizeB[idx]=0.04+rng()*0.055;
}

pGeo.setAttribute('position',new THREE.BufferAttribute(aPos,3));
pGeo.setAttribute('aHomeY',new THREE.BufferAttribute(aHomeY,1));
pGeo.setAttribute('aHomeR',new THREE.BufferAttribute(aHomeR,1));
pGeo.setAttribute('aAngVel',new THREE.BufferAttribute(aAngVel,1));
pGeo.setAttribute('aPhase',new THREE.BufferAttribute(aPhase,1));
pGeo.setAttribute('aBand',new THREE.BufferAttribute(aBand,1));
pGeo.setAttribute('aLayer',new THREE.BufferAttribute(aLayer,1));
pGeo.setAttribute('aSizeBase',new THREE.BufferAttribute(aSizeB,1));

const pMat = new THREE.ShaderMaterial({
  uniforms: pUniforms,
  vertexShader: PARTICLE_VS,
  fragmentShader: PARTICLE_FS,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
scene.add(new THREE.Points(pGeo, pMat));

/* ═══ UPDATE ═══ */
function update(dt,now){
  breathPhase+=dt*(0.8+loudNorm*0.6+sPitchConf*0.3);
  transientFlash*=0.84;
  const alive=ss(0.01,0.10,loudNorm);
  const spH=lerp(SPINE_MIN,SPINE_MAX,pitchNorm*0.5+loudNorm*0.5)*alive;
  const bSc=1+A.loudEnvelope*0.12+Math.sin(breathPhase*1.1)*0.02;
  const vib=A.vibratoDepth*0.05,wobDamp=1-sPitchConf*0.65;

  let sHue,sSat,sLit;
  if(centroidNorm<0.25){sHue=215;sSat=0.75;sLit=0.38}
  else if(centroidNorm<0.5){sHue=32;sSat=0.85;sLit=0.52}
  else if(centroidNorm<0.75){sHue=22;sSat=0.88;sLit=0.58}
  else{sHue=42;sSat=0.65;sLit=0.68}

  /* spine path */
  for(let i=0;i<SPINE_RINGS;i++){const t=i/(SPINE_RINGS-1);const y=t*spH*bSc;
    const wx=Math.sin(t*5+breathPhase*1.8)*vib*t+Math.sin(t*2+now*0.0004)*0.01*wobDamp;
    const wz=Math.cos(t*4.5+breathPhase*1.4)*vib*t*0.6+Math.cos(t*1.7+now*0.0003)*0.007*wobDamp;
    spinePts[i].x=wx;spinePts[i].y=y;spinePts[i].z=wz;}

  /* outer spine mesh */
  for(let ring=0;ring<SPINE_RINGS;ring++){const t=ring/(SPINE_RINGS-1);const p=spinePts[ring];
    const taper=1-t*0.55;const radius=(0.05+loudNorm*0.05+sOnset*0.025)*taper*alive;
    const glow=ss(0,0.7,t)*(0.35+sPitchConf*0.55+transientFlash*0.15);
    const c=hsl(sHue+t*30,sSat*0.85,sLit*0.6*glow);
    for(let s=0;s<SPINE_SEGS;s++){const a=(s/SPINE_SEGS)*Math.PI*2;const vi=(ring*SPINE_SEGS+s)*3;
      spPos[vi]=p.x+Math.cos(a)*radius;spPos[vi+1]=p.y;spPos[vi+2]=p.z+Math.sin(a)*radius;
      spCol[vi]=c.r*glow;spCol[vi+1]=c.g*glow;spCol[vi+2]=c.b*glow;}}
  spGeo.attributes.position.needsUpdate=true;spGeo.attributes.color.needsUpdate=true;

  /* inner spine */
  for(let ring=0;ring<SPINE_RINGS;ring++){const t=ring/(SPINE_RINGS-1);const p=spinePts[ring];
    const taper=1-t*0.6;const radius=(0.025+loudNorm*0.03+sOnset*0.015)*taper*alive;
    const glow=ss(0,0.6,t)*(0.5+sPitchConf*0.65+transientFlash*0.2);
    const c=hsl(sHue+t*15,sSat*0.5,Math.min(1,(sLit+0.15)*glow));
    for(let s=0;s<SPINE_SEGS;s++){const a=(s/SPINE_SEGS)*Math.PI*2;const vi=(ring*SPINE_SEGS+s)*3;
      sp2Pos[vi]=p.x+Math.cos(a)*radius;sp2Pos[vi+1]=p.y;sp2Pos[vi+2]=p.z+Math.sin(a)*radius;
      sp2Col[vi]=c.r*glow;sp2Col[vi+1]=c.g*glow;sp2Col[vi+2]=c.b*glow;}}
  spGeo2.attributes.position.needsUpdate=true;spGeo2.attributes.color.needsUpdate=true;

  /* core */
  const tip=spinePts[SPINE_RINGS-1];
  coreOrb.position.set(tip.x,tip.y,tip.z);
  const os=clamp((0.4+loudNorm*0.65+sPitchConf*0.5+transientFlash*0.3)*alive,0.08,1.8);
  coreOrb.scale.setScalar(os);coreOrb.material.opacity=0.2+sPitchConf*0.5+transientFlash*0.12;
  const oc=hsl(sHue-10,sSat*0.85,0.55+sPitchConf*0.15);coreOrb.material.color.setRGB(oc.r,oc.g,oc.b);
  coreHalo.position.copy(coreOrb.position);coreHalo.scale.setScalar(os*1.6);coreHalo.material.opacity=clamp(0.04+loudNorm*0.1+transientFlash*0.06,0,0.22);
  coreOuter.position.copy(coreOrb.position);coreOuter.scale.setScalar(os*2.2);coreOuter.material.opacity=clamp(0.02+loudNorm*0.06,0,0.12);
  coreInner.position.copy(coreOrb.position);coreInner.scale.setScalar(os*0.4);coreInner.material.opacity=0.3+sPitchConf*0.4;
  pulseRing.scale.setScalar(1+(1-sOnset)*1.4+transientFlash*0.7);pulseRing.material.opacity=sOnset*0.25+transientFlash*0.18;
  baseRing.scale.setScalar(1+loudNorm*0.6+sOnset*0.3);baseRing.material.opacity=0.05+loudNorm*0.08+transientFlash*0.04;
  cLight.position.set(tip.x*0.5,tip.y*0.6,tip.z+0.4);cLight.intensity=0.1+loudNorm*0.7+sPitchConf*0.3+transientFlash*0.2;
  cLight.color.setHSL((sHue%360)/360,sSat*0.8,0.55);
  baseGlowLight.intensity=0.15+loudNorm*0.35+transientFlash*0.1;baseGlowLight.color.setHSL((sHue%360)/360,sSat*0.5,0.3);
  groundMat.uniforms.uTime.value=now*0.001;groundMat.uniforms.uEnergy.value=loudNorm;

  /* ── GPU particle uniforms (the ONLY per-frame work for 360K particles) ── */
  pUniforms.uTime.value = now * 0.001;
  pUniforms.uBands.value.set(sBandE);
  pUniforms.uPeaks.value.set(peakBoost);
  pUniforms.uLoud.value = loudNorm;
  pUniforms.uPitchConf.value = sPitchConf;
  pUniforms.uFlash.value = transientFlash;
  pUniforms.uAlive.value = alive;
  pUniforms.uSpineH.value = spH * bSc;
  pUniforms.uBreath.value = breathPhase;
  pUniforms.uVibrato.value = A.vibratoDepth;
  pUniforms.uOnset.value = sOnset;
  pUniforms.uCentroid.value = centroidNorm;

  bloom.strength=lerp(bloom.strength,0.45+sPitchConf*0.4+transientFlash*0.25+sOnset*0.1,0.07);
  bloom.radius=lerp(bloom.radius,0.82+sPitchConf*0.18,0.05);
  bloom.threshold=lerp(bloom.threshold,0.58-transientFlash*0.08,0.05);
}

/* ═══ OVERLAY ═══ */
const eN=document.getElementById('v-note'),eF=document.getElementById('v-freq');
const eV=document.getElementById('v-vol'),eT=document.getElementById('v-timbre'),eR=document.getElementById('v-range');
function updateOverlay(){
  eN.textContent=A.note;eN.style.textShadow='0 0 '+(10+sPitchConf*18)+'px rgba(130,200,255,'+(0.15+transientFlash*0.2)+')';
  eF.textContent=A.pitch?A.pitch.toFixed(1)+' Hz':'— Hz';
  const db=sLoud;eV.textContent=db.toFixed(1)+' dB';eV.style.color=db>-18?'#f7d089':db>-42?'#95e1c2':'#89c1f0';
  eT.textContent=A.timbre;eR.textContent=A.range;
}

/* ═══ WS ═══ */
const dot=document.getElementById('dot');
function connect(){const ws=new WebSocket('ws://localhost:8765');
  ws.onopen=()=>{dot.classList.add('on')};ws.onclose=()=>{dot.classList.remove('on');setTimeout(connect,1500)};
  ws.onerror=()=>ws.close();ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}ingestFrame(d);updateOverlay()}}
connect();

function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h);composer.setSize(w,h);bloom.resolution.set(w,h)}
addEventListener('resize',resize);resize();

let lt=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min(0.05,(now-lt)/1000||0.016);lt=now;
  update(dt,now);const dr=now*0.000018;
  camera.position.x=lerp(camera.position.x,Math.sin(dr)*0.4,0.003);
  camera.position.y=lerp(camera.position.y,2.2+Math.cos(dr*0.55)*0.06,0.003);
  ctl.update();composer.render()}
requestAnimationFrame(animate);
</script>
</body>
