<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Voice / Music Visualizer</title>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#020609;
            font-family:'Inter','Segoe UI','SF Pro Text',sans-serif; }

        #canvas-container {
            position:absolute; top:0; left:0;
            width:100%; height:100%;
            z-index:1;
        }
        #ui-layer {
            position:absolute; top:0; left:0;
            width:100%; height:100%;
            pointer-events:none; z-index:10;
        }

        /* connection pill */
        #status-badge {
            position:absolute; bottom:22px; left:20px;
            display:flex; align-items:center; gap:7px;
            padding:6px 13px 6px 9px;
            background:rgba(4,12,26,0.75);
            border:1px solid rgba(40,80,130,0.18);
            border-radius:999px;
            backdrop-filter:blur(20px) saturate(140%);
            -webkit-backdrop-filter:blur(20px) saturate(140%);
            transition:border-color .5s;
        }
        #status-badge.live  { border-color:rgba(34,197,94,.28); }
        #status-badge.error { border-color:rgba(239,68,68,.28); }
        .status-dot { width:6px; height:6px; border-radius:50%; background:#f59e0b;
            flex-shrink:0; transition:background .5s, box-shadow .5s; }
        .status-dot.live  { background:#22c55e; box-shadow:0 0 7px rgba(34,197,94,.7); }
        .status-dot.error { background:#ef4444; box-shadow:0 0 7px rgba(239,68,68,.7); }
        #status-text { font-size:9.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
            color:rgba(120,160,200,.40); transition:color .5s; }
        #status-badge.live  #status-text { color:rgba(134,239,172,.60); }
        #status-badge.error #status-text { color:rgba(252,165,165,.60); }

        /* info panel */
        #info-panel {
            position:absolute; top:24px; right:24px; width:228px;
            background:rgba(8,11,18,0.72);
            border:1px solid rgba(255,255,255,.08);
            border-radius:16px;
            backdrop-filter:blur(28px) saturate(140%);
            -webkit-backdrop-filter:blur(28px) saturate(140%);
            box-shadow:0 24px 48px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
            padding:14px 14px 12px;
            display:flex; flex-direction:column; gap:0;
            overflow:hidden;
        }

        #info-panel::before {
            content:''; display:block;
            height:1px; width:100%;
            margin:-14px -14px 14px;
            width:calc(100% + 28px);
            background:linear-gradient(90deg,
                transparent 0%, rgba(255,200,100,.18) 30%, rgba(100,180,255,.14) 70%, transparent 100%);
            transition:background 0.6s;
        }

        .p-header {
            padding:0 0 10px;
            border-bottom:1px solid rgba(255,255,255,.07);
            display:flex; align-items:center; justify-content:space-between;
        }
        .p-header-label { font-size:8.5px; font-weight:700; letter-spacing:1.2px;
            text-transform:uppercase; color:rgba(200,210,230,.38); }
        .p-live-dot { width:5px; height:5px; border-radius:50%;
            background:rgba(245,158,11,.65); box-shadow:0 0 7px rgba(245,158,11,.45);
            transition:background .4s, box-shadow .4s; }
        .p-live-dot.active {
            background:rgba(74,222,128,.72); box-shadow:0 0 7px rgba(74,222,128,.5);
        }

        .note-section {
            padding:12px 0 11px;
            display:flex; align-items:center; gap:14px;
            border-bottom:1px solid rgba(255,255,255,.07);
        }
        .note-ring {
            width:54px; height:54px; border-radius:50%; flex-shrink:0;
            border:1px solid rgba(255,255,255,.12);
            display:flex; align-items:center; justify-content:center;
            transition:border-color .4s, box-shadow .4s, background .4s;
            position:relative;
        }
        .note-ring::after {
            content:''; position:absolute; inset:0; border-radius:50%;
            background:radial-gradient(circle at center, rgba(255,188,100,.06) 0%, transparent 70%);
            opacity:0; transition:opacity .4s;
        }
        .note-ring.voiced {
            border-color:rgba(255,200,100,.48);
            box-shadow:0 0 18px rgba(255,180,90,.16), 0 0 40px rgba(255,160,60,.06);
        }
        .note-ring.voiced::after { opacity:1; }
        #v-note {
            font-size:20px; font-weight:700; letter-spacing:-.5px; line-height:1;
            color:rgba(220,228,248,.36); transition:color .25s, text-shadow .25s;
            position:relative; z-index:1;
        }
        #v-note.voiced { color:#fff8e8; text-shadow:0 0 20px rgba(255,190,90,.3); }
        .note-meta { display:flex; flex-direction:column; gap:3px; }
        #note-sub { font-size:9px; font-weight:600; letter-spacing:.7px;
            text-transform:uppercase; color:rgba(200,210,230,.38);
            transition:color .3s; }
        #note-sub.voiced { color:rgba(255,200,120,.55); }
        #note-name-display {
            font-size:11px; font-weight:500; letter-spacing:.2px;
            color:rgba(220,228,248,.22); transition:color .3s;
            min-height:16px;
        }
        #note-name-display.voiced { color:rgba(220,228,248,.58); }

        .metrics { padding:10px 0 0; display:flex; flex-direction:column; gap:0; }
        .metric {
            padding:7px 0;
            border-bottom:1px solid rgba(255,255,255,.06);
            display:flex; align-items:center; justify-content:space-between; gap:8px;
        }
        .metric:last-child { border-bottom:none; padding-bottom:0; }
        .m-label { font-size:8px; font-weight:700; letter-spacing:1px;
            text-transform:uppercase; color:rgba(200,210,230,.32); }
        .m-value { font-family:'JetBrains Mono','Fira Code','Consolas',monospace;
            font-size:11.5px; font-weight:500; color:rgba(210,220,238,.32); transition:color .25s; }
        .m-value.lit { color:rgba(240,245,255,.82); }
        .vu-track { height:2px; border-radius:1px; background:rgba(255,255,255,.09);
            overflow:hidden; width:82px; margin-left:auto; margin-top:4px; }
        #vol-bar { height:100%; width:0%; border-radius:1px; background:#4ade80;
            transition:width .07s linear, background .2s; }
        .chip {
            display:inline-flex; align-items:center;
            padding:3px 9px; border-radius:999px;
            font-size:9.5px; font-weight:600; letter-spacing:.1px;
            border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03);
            color:rgba(210,220,238,.40);
            transition:color .25s, background .25s, border-color .25s, box-shadow .25s;
        }
        .chip.lit { box-shadow:0 0 10px rgba(255,255,255,.04); }

        #ax-hint {
            position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
            font-size:8.5px; letter-spacing:.7px; text-transform:uppercase;
            color:rgba(60,100,150,.24); pointer-events:none; white-space:nowrap;
        }

        #state-label {
            position:absolute; top:24px; left:24px;
            font-size:8.5px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase;
            color:rgba(100,150,200,.20); pointer-events:none;
            transition:color .4s;
        }
        #state-label.active { color:rgba(255,200,100,.28); }
    </style>
</head>
<body>
<canvas id="canvas-container"></canvas>
<div id="ui-layer">
    <div id="state-label">Idle</div>
    <div id="status-badge">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Connecting</span>
    </div>
    <div id="ax-hint">Pitch field &middot; Brightness &middot; Energy</div>
    <div id="info-panel">
        <div class="p-header">
            <span class="p-header-label">Voice Analysis</span>
            <span class="p-live-dot" id="p-live-dot"></span>
        </div>
        <div class="note-section">
            <div class="note-ring" id="note-ring">
                <span id="v-note">—</span>
            </div>
            <div class="note-meta">
                <div id="note-sub">No signal</div>
                <div id="note-name-display">—</div>
            </div>
        </div>
        <div class="metrics">
            <div class="metric">
                <div class="m-label">Frequency</div>
                <div class="m-value" id="v-freq">— Hz</div>
            </div>
            <div class="metric">
                <div class="m-label">Volume</div>
                <div>
                    <div class="m-value lit" id="v-vol">— dB</div>
                    <div class="vu-track">
                        <div id="vol-bar"></div>
                    </div>
                </div>
            </div>
            <div class="metric">
                <div class="m-label">Timbre</div>
                <span class="chip" id="v-timbre">—</span>
            </div>
            <div class="metric">
                <div class="m-label">Range</div>
                <span class="chip" id="v-range">—</span>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    const CONFIG = { wsUrl: 'ws://localhost:8765', bands: 16 };
    const MathUtils = {
        clamp: (v, lo, hi) => Math.max(lo, Math.min(hi, v)),
        lerp: (a, b, t) => a + (b - a) * t,
        smoothstep: (a, b, x) => {
            const t = MathUtils.clamp((x - a) / (b - a), 0, 1);
            return t * t * (3 - 2 * t);
        }
    };

    class AudioManager {
        constructor() {
            this.state = { mel: new Float32Array(64), pitch: 0, loudness: -80, centroid: 900, note: '—', timbre: '—', range: '—', onset: 0, pitchConf: 0 };
            this.smoothed = { pitch: 220, loud: -80, onset: 0, pitchConf: 0, pitchNorm: 0.5, loudNorm: 0 };
            this.transientFlash = 0;
            this.lastNote = '—';
        }
        ingestFrame(d) {
            const S = this.state;
            S.pitch = d.pitch || 0;
            S.loudness = d.loudness ?? -80;
            S.note = d.note || '—';
            S.timbre = d.timbre || '—';
            S.range = d.range || '—';
            S.onset = d.onset || 0;
            S.pitchConf = d.pitchConf || 0;

            const targetPitch = (S.pitch > 40) ? S.pitch : 220;
            const sm = this.smoothed;
            sm.pitch = MathUtils.lerp(sm.pitch, targetPitch, 0.15);
            sm.loud = MathUtils.lerp(sm.loud, S.loudness, 0.15);
            sm.onset = MathUtils.lerp(sm.onset, S.onset, 0.4);
            sm.pitchConf = MathUtils.lerp(sm.pitchConf, S.pitchConf, 0.15);
            sm.pitchNorm = MathUtils.lerp(sm.pitchNorm, MathUtils.clamp((Math.log(MathUtils.clamp(targetPitch, 80, 1500)) - Math.log(80)) / (Math.log(1500) - Math.log(80)), 0, 1), 0.18);
            sm.loudNorm = MathUtils.clamp((sm.loud + 58) / 38, 0, 1);

            if (S.onset > 0.3) this.transientFlash = Math.max(this.transientFlash, S.onset);
            if (S.note !== '—' && S.note !== this.lastNote) { this.transientFlash = 1; this.lastNote = S.note; }
        }
        updateTime(dt) { this.transientFlash *= 0.84; }
    }

    class UIManager {
        constructor(audioManager) {
            this.audio = audioManager;
            this.els = {
                note: document.getElementById('v-note'),
                freq: document.getElementById('v-freq'),
                vol: document.getElementById('v-vol'),
                timbre: document.getElementById('v-timbre'),
                range: document.getElementById('v-range'),
                noteSub: document.getElementById('note-sub'),
                noteNameDisplay: document.getElementById('note-name-display'),
                pLiveDot: document.getElementById('p-live-dot'),
                stateLabel: document.getElementById('state-label'),
            };
            this._lastState = null;
        }
        update(engineState) {
            const S = this.audio.state;
            const sm = this.audio.smoothed;
            const voiced = S.note && S.note !== '—';
            const ring = document.getElementById('note-ring');

            this.els.note.textContent = S.note || '—';
            if (voiced) {
                this.els.note.classList.add('voiced');
                ring.classList.add('voiced');
                this.els.noteSub.textContent = S.range !== '—' ? S.range + ' voice' : 'Voiced';
                this.els.noteNameDisplay.textContent = S.pitch ? S.pitch.toFixed(1) + ' Hz' : '—';
                this.els.pLiveDot.classList.add('active');
            } else {
                this.els.note.classList.remove('voiced');
                ring.classList.remove('voiced');
                this.els.noteSub.textContent = 'No signal';
                this.els.noteNameDisplay.textContent = '—';
                this.els.pLiveDot.classList.remove('active');
            }

            if (engineState && engineState !== this._lastState) {
                this._lastState = engineState;
                this.els.stateLabel.textContent = engineState;
                this.els.stateLabel.classList.toggle('active', engineState === 'TRACKING');
            }

            this.els.freq.textContent = S.pitch ? S.pitch.toFixed(1) + ' Hz' : '— Hz';
            const db = sm.loud;
            this.els.vol.textContent = db.toFixed(1) + ' dB';
            const bar = document.getElementById('vol-bar');
            if (bar) bar.style.width=Math.max(0,Math.min(100,((db+70)/60)*100)).toFixed(1)+'%';
            this.els.timbre.textContent=S.timbre||'—';
            this.els.range.textContent=voiced?S.range:'—';
        }
    }

    class ConnectionManager {
        constructor(url, onMessageCallback) {
            this.url = url; this.onMessage = onMessageCallback;
            this.connect();
        }
        connect() {
            this.ws = new WebSocket(this.url);
            this.ws.onopen = () => { document.getElementById('status-badge').className = 'live'; document.getElementById('status-text').textContent = 'Connected'; };
            this.ws.onmessage = (e) => { try { this.onMessage(JSON.parse(e.data)); } catch (err) {} };
            this.ws.onclose = () => { document.getElementById('status-badge').className = 'error'; document.getElementById('status-text').textContent = 'Disconnected'; setTimeout(() => this.connect(), 2000); };
        }
    }
</script>
<script src="./visualizer-engine.js"></script>
<script>
    const audio = new AudioManager();
    const ui = new UIManager(audio);
    const engine = new VisualizerEngine('canvas-container', audio);

    const _origRenderFrame = engine.renderFrame.bind(engine);
    engine.renderFrame = function() {
        _origRenderFrame();
        ui.update(engine.systems?.rings?.smState ?? null);
    };

    const wsManager = new ConnectionManager(CONFIG.wsUrl, (data) => audio.ingestFrame(data));

    window.addEventListener('resize', () => {
        engine.camera.aspect = window.innerWidth / window.innerHeight;
        engine.camera.updateProjectionMatrix();
        engine.renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
