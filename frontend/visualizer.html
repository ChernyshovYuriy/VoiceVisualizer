<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Voice / Music Visualizer</title>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#020609;
            font-family:'Inter','Segoe UI','SF Pro Text',sans-serif; }

        #canvas-container {
            position:absolute; top:0; left:0;
            width:100%; height:100%;
            z-index:1;
        }
        #ui-layer {
            position:absolute; top:0; left:0;
            width:100%; height:100%;
            pointer-events:none; z-index:10;
        }

        /* connection pill */
        #status-badge {
            position:absolute; bottom:22px; left:20px;
            display:flex; align-items:center; gap:7px;
            padding:7px 14px 7px 10px;
            background:rgba(4,12,26,0.80); border:1px solid rgba(40,80,130,0.22);
            border-radius:999px;
            backdrop-filter:blur(20px) saturate(130%);
            -webkit-backdrop-filter:blur(20px) saturate(130%);
            transition:border-color .4s;
        }
        #status-badge.live  { border-color:rgba(34,197,94,.32); }
        #status-badge.error { border-color:rgba(239,68,68,.32); }
        .status-dot { width:7px; height:7px; border-radius:50%; background:#f59e0b;
            flex-shrink:0; transition:background .4s, box-shadow .4s; }
        .status-dot.live  { background:#22c55e; box-shadow:0 0 8px rgba(34,197,94,.7); }
        .status-dot.error { background:#ef4444; box-shadow:0 0 8px rgba(239,68,68,.7); }
        #status-text { font-size:10px; font-weight:700; letter-spacing:.9px; text-transform:uppercase;
            color:rgba(120,160,200,.45); transition:color .4s; }
        #status-badge.live  #status-text { color:rgba(134,239,172,.65); }
        #status-badge.error #status-text { color:rgba(252,165,165,.65); }

        /* compact floating analysis card */
        #info-panel {
            position:absolute; top:26px; right:26px; width:250px;
            background:linear-gradient(175deg, rgba(16,20,30,.56), rgba(8,10,15,.70));
            border:1px solid rgba(255,255,255,.10);
            border-radius:14px;
            backdrop-filter:blur(24px) saturate(130%);
            -webkit-backdrop-filter:blur(24px) saturate(130%);
            box-shadow:0 20px 44px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
            padding:12px 12px 10px;
            display:flex; flex-direction:column; gap:8px;
        }
        .p-header { padding:2px 2px 8px; border-bottom:1px solid rgba(255,255,255,.09);
            display:flex; align-items:center; justify-content:space-between; }
        .p-header-label { font-size:9px; font-weight:700; letter-spacing:1.1px;
            text-transform:uppercase; color:rgba(216,224,240,.58); }
        .p-live-dot { width:5px; height:5px; border-radius:50%;
            background:rgba(245,158,11,.72); box-shadow:0 0 8px rgba(245,158,11,.55); }

        .note-section { padding:4px 2px 2px; display:flex; align-items:center; gap:12px; }
        .note-ring { width:58px; height:58px; border-radius:50%;
            border:1px solid rgba(255,255,255,.16);
            display:flex; align-items:center; justify-content:center;
            transition:border-color .3s, box-shadow .3s; }
        .note-ring.voiced { border-color:rgba(255,204,122,.56);
            box-shadow:0 0 22px rgba(255,188,106,.20), inset 0 0 12px rgba(255,188,106,.08); }
        #v-note { font-size:22px; font-weight:700; letter-spacing:-.6px; line-height:1;
            color:rgba(232,238,255,.48); transition:color .2s, text-shadow .2s; }
        #v-note.voiced { color:#fff4df; text-shadow:0 0 16px rgba(255,188,106,.28); }
        #note-sub { font-size:9px; font-weight:600; letter-spacing:.7px;
            text-transform:uppercase; color:rgba(206,214,232,.52); }

        .metrics { padding:2px; display:flex; flex-direction:column; gap:4px; }
        .metric { padding:5px 0; border-bottom:1px solid rgba(255,255,255,.08);
            display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .metric:last-child { border-bottom:none; }
        .m-label { font-size:8px; font-weight:700; letter-spacing:1px;
            text-transform:uppercase; color:rgba(220,226,240,.42); }
        .m-value { font-family:'JetBrains Mono','Fira Code','Consolas',monospace;
            font-size:12px; font-weight:500; color:rgba(220,228,244,.42); transition:color .2s; }
        .m-value.lit { color:#fff8e9; }
        .vu-track { height:3px; border-radius:2px; background:rgba(255,255,255,.12);
            overflow:hidden; width:86px; margin-left:auto; }
        #vol-bar { height:100%; width:0%; border-radius:2px; background:#4ade80;
            transition:width .08s linear, background .25s; }
        .chip { display:inline-block; padding:3px 10px; border-radius:999px;
            font-size:10px; font-weight:600; letter-spacing:.15px;
            border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03);
            color:rgba(220,228,244,.54); transition:color .2s, background .2s, border-color .2s; }
        #ax-hint { position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
            font-size:9px; letter-spacing:.6px; text-transform:uppercase;
            color:rgba(60,100,150,.28); pointer-events:none; white-space:nowrap; }
    </style>
</head>
<body>
<canvas id="canvas-container"></canvas>
<div id="ui-layer">
    <div id="status-badge">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Connecting</span>
    </div>
    <div id="ax-hint">Pitch field &middot; Brightness &middot; Energy</div>
    <div id="info-panel">
        <div class="p-header">
            <span class="p-header-label">Analysis</span>
            <span class="p-live-dot"></span>
        </div>
        <div class="note-section">
            <div class="note-ring" id="note-ring">
                <span id="v-note">—</span>
            </div>
            <div>
                <div id="note-sub">No signal</div>
            </div>
        </div>
        <div class="metrics">
            <div class="metric">
                <div class="m-label">Frequency</div>
                <div class="m-value" id="v-freq">— Hz</div>
            </div>
            <div class="metric">
                <div class="m-label">Volume</div>
                <div>
                    <div class="m-value lit" id="v-vol">— dB</div>
                    <div class="vu-track"><div id="vol-bar"></div></div>
                </div>
            </div>
            <div class="metric">
                <div class="m-label">Timbre</div>
                <span class="chip" id="v-timbre">—</span>
            </div>
            <div class="metric">
                <div class="m-label">Vocal Range</div>
                <span class="chip" id="v-range">—</span>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    /**
     * ============================================================================
     * CONFIGURATION & UTILS
     * ============================================================================
     */
    const CONFIG = {
        wsUrl: 'ws://localhost:8765',
        bands: 16
    };

    const MathUtils = {
        clamp: (v, lo, hi) => Math.max(lo, Math.min(hi, v)),
        lerp: (a, b, t) => a + (b - a) * t,
        smoothstep: (a, b, x) => {
            const t = MathUtils.clamp((x - a) / (b - a), 0, 1);
            return t * t * (3 - 2 * t);
        },
        hsl: (h, s, l) => {
            h = ((h % 360) + 360) % 360;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
            };
            return { r: f(0), g: f(8), b: f(4) };
        }
    };

    /**
     * ============================================================================
     * AUDIO DATA MANAGER
     * Handles ingestion and smoothing of raw data from the WebSocket
     * ============================================================================
     */
    class AudioManager {
        constructor() {
            this.state = {
                mel: new Float32Array(64),
                pitch: 0, loudness: -80, centroid: 900,
                note: '—', timbre: '—', range: '—',
                onset: 0, energy: 0, pitchConf: 0,
                peaks: [], pitchHist: [], loudHist: [],
                vibratoDepth: 0, loudEnvelope: 0, phraseRising: false
            };

            this.smoothed = {
                pitch: 220, loud: -80, centroid: 900,
                onset: 0, energy: 0, pitchConf: 0,
                pitchNorm: 0.5, loudNorm: 0, centroidNorm: 0.5
            };

            this.bandE = new Float32Array(CONFIG.bands);
            this.sBandE = new Float32Array(CONFIG.bands);
            this.peakBoost = new Float32Array(CONFIG.bands);

            this.transientFlash = 0;
            this.breathPhase = 0;
            this.lastNote = '—';
        }

        ingestFrame(d) {
            const S = this.state;
            for(let i=0; i<64; i++) S.mel[i] = MathUtils.clamp((d.mel && d.mel[i]) || 0, 0, 1);

            S.pitch = d.pitch || 0;
            S.loudness = d.loudness ?? -80;
            S.centroid = d.centroid || 900;
            S.note = d.note || '—';
            S.timbre = d.timbre || '—';
            S.range = d.range || '—';
            S.onset = d.onset || 0;
            S.energy = d.energy || 0;
            S.pitchConf = d.pitchConf || 0;
            S.peaks = d.peaks || [];
            S.pitchHist = d.pitchHist || [];
            S.loudHist = d.loudHist || [];

            // Calculate Vibrato
            if (S.pitchHist.length > 5) {
                const mean = S.pitchHist.reduce((a, b) => a + b) / S.pitchHist.length;
                const variance = S.pitchHist.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / S.pitchHist.length;
                S.vibratoDepth = MathUtils.clamp(Math.sqrt(variance) / 30, 0, 1);
            }

            // Calculate Loudness Envelope
            if (S.loudHist.length > 3) {
                const recent = S.loudHist.slice(-5);
                const avgRecent = recent.reduce((a, b) => a + b, 0) / recent.length;
                S.loudEnvelope = MathUtils.clamp((avgRecent + 60) / 40, 0, 1);
            }

            // Interpolate smoothed values
            const targetPitch = (S.pitch > 40) ? S.pitch : S.centroid;
            const sm = this.smoothed;

            sm.pitch = MathUtils.lerp(sm.pitch, targetPitch, 0.15);
            sm.loud = MathUtils.lerp(sm.loud, S.loudness, 0.15);
            sm.centroid = MathUtils.lerp(sm.centroid, S.centroid, 0.12);
            sm.onset = MathUtils.lerp(sm.onset, S.onset, 0.4);
            sm.energy = MathUtils.lerp(sm.energy, S.energy, 0.2);
            sm.pitchConf = MathUtils.lerp(sm.pitchConf, S.pitchConf, 0.15);

            // Normalization mappings
            sm.pitchNorm = MathUtils.lerp(sm.pitchNorm, MathUtils.clamp((Math.log(MathUtils.clamp(targetPitch, 80, 1500)) - Math.log(80)) / (Math.log(1500) - Math.log(80)), 0, 1), 0.18);
            sm.loudNorm = MathUtils.clamp((sm.loud + 58) / 38, 0, 1);
            sm.centroidNorm = MathUtils.clamp((Math.log(MathUtils.clamp(sm.centroid, 120, 4000)) - Math.log(120)) / (Math.log(4000) - Math.log(120)), 0, 1);

            // Band calculations
            const bpb = 64 / CONFIG.bands;
            this.peakBoost.fill(0);

            for (let b = 0; b < CONFIG.bands; b++) {
                let sum = 0;
                const s0 = Math.floor(b * bpb), s1 = Math.floor((b + 1) * bpb);
                for (let i = s0; i < s1; i++) sum += S.mel[i];
                this.bandE[b] = sum / (s1 - s0);
                this.sBandE[b] = MathUtils.lerp(this.sBandE[b], this.bandE[b], 0.22);
            }

            for (const pk of S.peaks) {
                const ti = Math.floor(pk.bin / bpb);
                if (ti >= 0 && ti < CONFIG.bands) this.peakBoost[ti] = Math.max(this.peakBoost[ti], pk.value);
            }

            // Transients
            if (S.onset > 0.3) this.transientFlash = Math.max(this.transientFlash, S.onset);
            if (S.note !== '—' && S.note !== this.lastNote) {
                this.transientFlash = 1;
                this.lastNote = S.note;
            }
        }

        updateTime(dt) {
            this.breathPhase += dt * (0.8 + this.smoothed.loudNorm * 0.6 + this.smoothed.pitchConf * 0.3);
            this.transientFlash *= 0.84; // Decay
        }
    }

    /**
     * ============================================================================
     * UI MANAGER
     * Handles DOM updates decoupled from the render loop
     * ============================================================================
     */
    class UIManager {
        constructor(audioManager) {
            this.audio = audioManager;
            this.els = {
                note: document.getElementById('v-note'),
                freq: document.getElementById('v-freq'),
                vol: document.getElementById('v-vol'),
                timbre: document.getElementById('v-timbre'),
                range: document.getElementById('v-range')
            };
        }

        update() {
            const S = this.audio.state;
            const sm = this.audio.smoothed;
            const voiced = S.note && S.note !== '—';

            const ring = document.getElementById('note-ring');
            const sub  = document.getElementById('note-sub');
            this.els.note.textContent = S.note || '—';
            if (voiced) {
                this.els.note.classList.add('voiced'); ring.classList.add('voiced');
                sub.textContent = (S.range && S.range !== '—') ? S.range + ' voice' : 'Voiced';
                this.els.note.style.textShadow = `0 0 ${14 + sm.pitchConf * 26}px rgba(96,165,250,${(0.16 + this.audio.transientFlash * 0.28).toFixed(2)})`;
            } else {
                this.els.note.classList.remove('voiced'); ring.classList.remove('voiced');
                sub.textContent = 'No signal'; this.els.note.style.textShadow = 'none';
            }

            this.els.freq.textContent = S.pitch ? S.pitch.toFixed(1) + ' Hz' : '— Hz';
            this.els.freq.classList.toggle('lit', voiced);

            const db = sm.loud;
            this.els.vol.textContent = db.toFixed(1) + ' dB';
            const vc = db > -18 ? '#f87171' : db > -42 ? '#fbbf24' : '#4ade80';
            this.els.vol.style.color = vc;
            const bar = document.getElementById('vol-bar');
            if (bar) { bar.style.width=Math.max(0,Math.min(100,((db+70)/60)*100)).toFixed(1)+'%'; bar.style.background=vc; }

            const TC={Dark:['#60a5fa','rgba(59,130,246,.12)'],Warm:['#fbbf24','rgba(245,158,11,.12)'],
                      Bright:['#fb923c','rgba(249,115,22,.12)'],Brilliant:['#f87171','rgba(239,68,68,.12)']};
            const tc=TC[S.timbre];
            this.els.timbre.textContent=S.timbre||'—';
            if(tc&&voiced){this.els.timbre.style.color=tc[0];this.els.timbre.style.background=tc[1];this.els.timbre.style.borderColor=tc[0]+'44';}
            else{this.els.timbre.style.color='';this.els.timbre.style.background='';this.els.timbre.style.borderColor='';}

            const RC={Bass:['#60a5fa','rgba(59,130,246,.12)'],Chest:['#4ade80','rgba(34,197,94,.12)'],
                      Mixed:['#fbbf24','rgba(245,158,11,.12)'],Head:['#fb923c','rgba(249,115,22,.12)'],
                      Whistle:['#f87171','rgba(239,68,68,.12)']};
            const rc=RC[S.range];
            this.els.range.textContent=voiced?(S.range||'—'):'—';
            if(rc&&voiced){this.els.range.style.color=rc[0];this.els.range.style.background=rc[1];this.els.range.style.borderColor=rc[0]+'44';}
            else{this.els.range.style.color='';this.els.range.style.background='';this.els.range.style.borderColor='';}
        }
    }

    /**
     * ============================================================================
     * CONNECTION MANAGER
     * Handles WebSocket connection with exponential backoff
     * ============================================================================
     */
    class ConnectionManager {
        constructor(url, onMessageCallback) {
            this.url = url;
            this.onMessage = onMessageCallback;
            this.reconnectAttempts = 0;
            this.dot = document.getElementById('status-dot');
            this.text = document.getElementById('status-text');
            this.badge = document.getElementById('status-badge');
            this.connect();
        }

        setStatus(state) {
            this.dot.className = 'status-dot ' + state;
            this.badge.className = state;
            this.text.textContent = state === 'live' ? 'Connected' : state === 'error' ? 'Disconnected' : 'Connecting...';
        }

        connect() {
            this.setStatus('connecting');
            this.ws = new WebSocket(this.url);

            this.ws.onopen = () => {
                this.setStatus('live');
                this.reconnectAttempts = 0;
            };

            this.ws.onmessage = (e) => {
                try {
                    this.onMessage(JSON.parse(e.data));
                } catch (err) {
                    console.warn("WS Parse Error", err);
                }
            };

            this.ws.onclose = () => {
                this.setStatus('error');
                const timeout = Math.min(10000, 1000 * Math.pow(1.5, this.reconnectAttempts));
                this.reconnectAttempts++;
                setTimeout(() => this.connect(), timeout);
            };

            this.ws.onerror = () => this.ws.close();
        }
    }
</script>
<script src="./visualizer-engine.js"></script>
<script>
    // ================= Initialize App =================
    const audio = new AudioManager();
    const ui = new UIManager(audio);
    const engine = new VisualizerEngine('canvas-container', audio);

    const wsManager = new ConnectionManager(CONFIG.wsUrl, (data) => {
        audio.ingestFrame(data);
        ui.update();
    });
</script>
</body>
</html>
