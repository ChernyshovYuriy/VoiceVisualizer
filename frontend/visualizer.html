<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020609}
#c{display:block}
#info{
  position:absolute;top:16px;right:16px;
  background:linear-gradient(160deg,rgba(12,22,42,0.78),rgba(6,12,28,0.72));
  border:1px solid rgba(120,180,240,0.18);border-radius:18px;padding:18px 22px;
  font-family:'Segoe UI','SF Pro Text',sans-serif;min-width:220px;pointer-events:none;
  backdrop-filter:blur(18px) saturate(130%);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
#info table{border-collapse:collapse;width:100%}
#info td{padding:5px 0}
.lbl{color:rgba(160,195,230,0.50);font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding-right:14px;white-space:nowrap}
.val{color:#e0eeff;font-size:15px;font-weight:600}
.val.big{font-size:28px;font-weight:700;color:#f0f8ff;letter-spacing:-0.5px}
#dot{position:absolute;top:16px;left:16px;width:8px;height:8px;border-radius:50%;background:#2b3645;transition:background .4s,box-shadow .4s}
#dot.on{background:#3fb950;box-shadow:0 0 10px rgba(63,185,80,.55)}
#tag{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  border:1px solid rgba(120,190,255,0.12);border-radius:12px;padding:7px 16px;
  background:rgba(8,16,32,0.5);backdrop-filter:blur(10px);pointer-events:none;
  font-family:'Segoe UI',sans-serif;font-size:10px;color:rgba(180,210,240,0.45);letter-spacing:.5px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <table>
    <tr><td class="lbl">Note</td><td class="val big" id="v-note">—</td></tr>
    <tr><td class="lbl">Freq</td><td class="val" id="v-freq">— Hz</td></tr>
    <tr><td class="lbl">Volume</td><td class="val" id="v-vol">— dB</td></tr>
    <tr><td class="lbl">Timbre</td><td class="val" id="v-timbre">—</td></tr>
    <tr><td class="lbl">Range</td><td class="val" id="v-range">—</td></tr>
  </table>
</div>
<div id="dot"></div>
<div id="tag">Voice creature — particle anatomy shaped by pitch, timbre, and resonance</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

/* ═══════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════ */
const N_STREAMS = 20;
const PPS = 160;                     /* particles per stream */
const TOTAL_P = N_STREAMS * PPS;
const SPINE_RINGS = 36;
const SPINE_SEGS = 10;
const SPINE_MIN = 1.5;
const SPINE_MAX = 3.8;
const AMBIENT_DUST = 300;

/* ═══════════════════════════════════════════════════════════
   AUDIO (same pipeline as v3)
   ═══════════════════════════════════════════════════════════ */
const A={mel:new Float32Array(64),pitch:0,loudness:-80,centroid:900,
  note:'—',timbre:'—',range:'—',onset:0,energy:0,pitchConf:0,peaks:[],
  melHist:[],pitchHist:[],loudHist:[],centroidHist:[],onsetHist:[],
  vibratoDepth:0,loudEnvelope:0,phraseRising:false};

let sPitch=220,sLoud=-80,sCentroid=900,sOnset=0,sEnergy=0,sPitchConf=0;
let pitchNorm=0.5,loudNorm=0,centroidNorm=0.5;
let breathPhase=0,transientFlash=0,lastNote='—';

const bandE=new Float32Array(N_STREAMS);
const sBandE=new Float32Array(N_STREAMS);
const peakBoost=new Float32Array(N_STREAMS);

function ingestFrame(d){
  for(let i=0;i<64;i++)A.mel[i]=clamp((d.mel&&d.mel[i])||0,0,1);
  A.pitch=d.pitch||0;A.loudness=d.loudness??-80;A.centroid=d.centroid||900;
  A.note=d.note||'—';A.timbre=d.timbre||'—';A.range=d.range||'—';
  A.onset=d.onset||0;A.energy=d.energy||0;A.pitchConf=d.pitchConf||0;
  A.peaks=d.peaks||[];A.melHist=d.melHist||[];
  A.pitchHist=d.pitchHist||[];A.loudHist=d.loudHist||[];
  A.centroidHist=d.centroidHist||[];A.onsetHist=d.onsetHist||[];

  if(A.pitchHist.length>5){
    const ph=A.pitchHist,n=ph.length;let m=0;for(let i=0;i<n;i++)m+=ph[i];m/=n;
    let v=0;for(let i=0;i<n;i++)v+=(ph[i]-m)**2;v/=n;
    A.vibratoDepth=clamp(Math.sqrt(v)/30,0,1);
  }
  if(A.loudHist.length>3){
    const lh=A.loudHist,r=lh.slice(-5),o=lh.slice(-10,-5);
    const ar=r.reduce((s,v)=>s+v,0)/r.length;
    const ao=o.length?o.reduce((s,v)=>s+v,0)/o.length:ar;
    A.phraseRising=ar>ao+1;A.loudEnvelope=clamp((ar+60)/40,0,1);
  }

  const tp=(A.pitch>40)?A.pitch:A.centroid;
  sPitch=lerp(sPitch,tp,0.15);sLoud=lerp(sLoud,A.loudness,0.15);
  sCentroid=lerp(sCentroid,A.centroid,0.12);
  sOnset=lerp(sOnset,A.onset,0.4);sEnergy=lerp(sEnergy,A.energy,0.2);
  sPitchConf=lerp(sPitchConf,A.pitchConf,0.15);
  pitchNorm=lerp(pitchNorm,clamp((Math.log(clamp(tp,80,1500))-Math.log(80))/(Math.log(1500)-Math.log(80)),0,1),0.18);
  loudNorm=clamp((sLoud+58)/38,0,1);
  centroidNorm=clamp((Math.log(clamp(sCentroid,120,4000))-Math.log(120))/(Math.log(4000)-Math.log(120)),0,1);

  const bpb=64/N_STREAMS;peakBoost.fill(0);
  for(let b=0;b<N_STREAMS;b++){
    let s=0;const s0=Math.floor(b*bpb),s1=Math.floor((b+1)*bpb);
    for(let i=s0;i<s1;i++)s+=A.mel[i];
    bandE[b]=s/(s1-s0);sBandE[b]=lerp(sBandE[b],bandE[b],0.22);
  }
  for(const pk of A.peaks){
    const ti=Math.floor(pk.bin/bpb);
    if(ti>=0&&ti<N_STREAMS)peakBoost[ti]=Math.max(peakBoost[ti],pk.value);
  }
  if(A.onset>0.3)transientFlash=Math.max(transientFlash,A.onset);
  if(A.note!=='—'&&A.note!==lastNote){transientFlash=1;lastNote=A.note}
}

/* ═══════════════════════════════════════════════════════════
   THREE.JS
   ═══════════════════════════════════════════════════════════ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020609);
scene.fog=new THREE.FogExp2(0x040a14,0.035);

const camera=new THREE.PerspectiveCamera(42,1,0.1,100);
camera.position.set(0,2.0,5.0);
const ctl=new THREE.OrbitControls(camera,renderer.domElement);
ctl.target.set(0,1.3,0);ctl.enableDamping=true;ctl.dampingFactor=0.06;
ctl.enablePan=false;ctl.minDistance=2;ctl.maxDistance=10;
ctl.maxPolarAngle=Math.PI*0.52;ctl.minPolarAngle=Math.PI*0.08;ctl.update();

const composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.65,0.8,0.62);
composer.addPass(bloom);

/* lights */
scene.add(new THREE.AmbientLight(0x0a1828,0.2));
scene.add(new THREE.HemisphereLight(0x2266aa,0x020408,0.2));
const kl=new THREE.PointLight(0x6699cc,0.3,12,2);kl.position.set(2,4,3);scene.add(kl);
const wl=new THREE.PointLight(0xcc8844,0.15,8,2);wl.position.set(-2,2,-1);scene.add(wl);
const cLight=new THREE.PointLight(0x88ccff,0,6,1.5);cLight.position.set(0,2,0.5);scene.add(cLight);

/* floor */
scene.add(new THREE.Mesh(
  new THREE.CircleGeometry(4,64).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({color:0x060e18,transparent:true,opacity:0.5,depthWrite:false})
)).position.y=-0.02;

function hsl(h,s,l){
  h=((h%360)+360)%360;const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};
  return{r:f(0),g:f(8),b:f(4)};
}

/* ═══════════════════════════════════════════════════════════
   SPINE — tapered glowing column
   ═══════════════════════════════════════════════════════════ */
const spV=SPINE_RINGS*SPINE_SEGS;
const spPos=new Float32Array(spV*3),spCol=new Float32Array(spV*3);
const spIdx=[];
for(let r=0;r<SPINE_RINGS-1;r++)for(let s=0;s<SPINE_SEGS;s++){
  const a=r*SPINE_SEGS+s,b=a+SPINE_SEGS,c=r*SPINE_SEGS+((s+1)%SPINE_SEGS),d=c+SPINE_SEGS;
  spIdx.push(a,b,c,c,b,d);
}
const spGeo=new THREE.BufferGeometry();
spGeo.setAttribute('position',new THREE.BufferAttribute(spPos,3));
spGeo.setAttribute('color',new THREE.BufferAttribute(spCol,3));
spGeo.setIndex(spIdx);
scene.add(new THREE.Mesh(spGeo,new THREE.MeshBasicMaterial({
  vertexColors:true,transparent:true,opacity:0.6,side:THREE.DoubleSide,
  blending:THREE.AdditiveBlending,depthWrite:false
})));

const spinePts=[];for(let i=0;i<SPINE_RINGS;i++)spinePts.push({x:0,y:0,z:0});

/* ═══════════════════════════════════════════════════════════
   CORE ORB
   ═══════════════════════════════════════════════════════════ */
const coreOrb=new THREE.Mesh(new THREE.SphereGeometry(0.08,24,24),
  new THREE.MeshBasicMaterial({color:0xaaddff,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(coreOrb);
const coreHalo=new THREE.Mesh(new THREE.SphereGeometry(0.13,24,24),
  new THREE.MeshBasicMaterial({color:0x6699cc,transparent:true,opacity:0.12,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(coreHalo);
const coreInner=new THREE.Mesh(new THREE.SphereGeometry(0.035,16,16),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(coreInner);

/* onset pulse */
const pulseRing=new THREE.Mesh(new THREE.RingGeometry(0.06,0.18,48),
  new THREE.MeshBasicMaterial({color:0x77bbee,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
pulseRing.rotation.x=-Math.PI/2;pulseRing.position.y=0.02;scene.add(pulseRing);

/* ═══════════════════════════════════════════════════════════
   PARTICLE STREAM TENDRILS
   Each stream = a flowing arm of particles forming organic shapes.
   Particles are positioned along a parametric curve that branches
   from the spine. Density + glow create visual "tendril" form.
   ═══════════════════════════════════════════════════════════ */
const streamPos=new Float32Array(TOTAL_P*3);
const streamCol=new Float32Array(TOTAL_P*3);
const streamSizes=new Float32Array(TOTAL_P);
const streamGeo=new THREE.BufferGeometry();
streamGeo.setAttribute('position',new THREE.BufferAttribute(streamPos,3));
streamGeo.setAttribute('color',new THREE.BufferAttribute(streamCol,3));
streamGeo.setAttribute('size',new THREE.BufferAttribute(streamSizes,1));

/* Custom shader for variable-size glowing points */
const streamMat=new THREE.ShaderMaterial({
  uniforms:{},
  vertexShader:`
    attribute float size;
    varying vec3 vColor;
    void main(){
      vColor=color;
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=size*(420.0/(-mv.z));
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying vec3 vColor;
    void main(){
      float d=length(gl_PointCoord-0.5)*2.0;
      float alpha=1.0-smoothstep(0.0,1.0,d);
      alpha=pow(alpha,1.5);
      gl_FragColor=vec4(vColor*alpha,alpha*0.85);
    }
  `,
  vertexColors:true,
  transparent:true,
  blending:THREE.AdditiveBlending,
  depthWrite:false,
});
const streamPoints=new THREE.Points(streamGeo,streamMat);
scene.add(streamPoints);

/* per-stream config */
const streams=[];
for(let i=0;i<N_STREAMS;i++){
  const angle=(i/N_STREAMS)*Math.PI*2;
  const branchH=0.1+(i%10)/10*0.75;
  /* color: low bands warm, high bands cool */
  const t=i/N_STREAMS;
  let bc;
  if(t<0.2)bc={r:1.0,g:0.45,b:0.15};        /* deep amber */
  else if(t<0.35)bc={r:0.95,g:0.65,b:0.2};   /* warm gold */
  else if(t<0.5)bc={r:0.6,g:0.9,b:0.35};     /* chartreuse */
  else if(t<0.65)bc={r:0.25,g:0.85,b:0.65};  /* teal */
  else if(t<0.8)bc={r:0.2,g:0.7,b:0.95};     /* sky blue */
  else bc={r:0.5,g:0.6,b:1.0};               /* lavender */

  /* each particle's fixed parameters */
  const particles=[];
  for(let p=0;p<PPS;p++){
    const pt=p/PPS; /* 0→1 position along stream */
    particles.push({
      t:pt,
      jitterX:(Math.random()-0.5)*0.35,
      jitterY:(Math.random()-0.5)*0.2,
      jitterZ:(Math.random()-0.5)*0.35,
      phaseOff:Math.random()*Math.PI*2,
      sizeBase:0.06+Math.random()*0.04,
    });
  }
  streams.push({angle,branchH,bc,particles,band:i,phase:i*1.1});
}

/* ═══════════════════════════════════════════════════════════
   AMBIENT DUST
   ═══════════════════════════════════════════════════════════ */
const adPos=new Float32Array(AMBIENT_DUST*3),adCol=new Float32Array(AMBIENT_DUST*3);
const adPh=new Float32Array(AMBIENT_DUST),adRad=new Float32Array(AMBIENT_DUST),adSpd=new Float32Array(AMBIENT_DUST),adYB=new Float32Array(AMBIENT_DUST);
for(let i=0;i<AMBIENT_DUST;i++){adPh[i]=Math.random()*Math.PI*2;adRad[i]=0.8+Math.random()*3;adSpd[i]=0.04+Math.random()*0.15;adYB[i]=Math.random()*3.5}
const adGeo=new THREE.BufferGeometry();
adGeo.setAttribute('position',new THREE.BufferAttribute(adPos,3));
adGeo.setAttribute('color',new THREE.BufferAttribute(adCol,3));
scene.add(new THREE.Points(adGeo,new THREE.PointsMaterial({size:0.012,vertexColors:true,transparent:true,opacity:0.22,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true})));

/* ═══════════════════════════════════════════════════════════
   UPDATE
   ═══════════════════════════════════════════════════════════ */
function update(dt,now){
  breathPhase+=dt*(0.8+loudNorm*1.2+sPitchConf*0.5);
  transientFlash*=0.85;

  const alive=ss(0.01,0.12,loudNorm);
  const spH=lerp(SPINE_MIN,SPINE_MAX,pitchNorm*0.5+loudNorm*0.5)*alive;
  const bSc=1+A.loudEnvelope*0.1+Math.sin(breathPhase*1.1)*0.02;
  const vib=A.vibratoDepth*0.05;
  const wobDamp=1-sPitchConf*0.65;

  let sHue,sSat,sLit;
  if(centroidNorm<0.25){sHue=215;sSat=0.7;sLit=0.35}
  else if(centroidNorm<0.5){sHue=32;sSat=0.8;sLit=0.5}
  else if(centroidNorm<0.75){sHue=22;sSat=0.85;sLit=0.55}
  else{sHue=42;sSat=0.6;sLit=0.65}

  /* ── spine path ────────────────────────────────────────── */
  for(let i=0;i<SPINE_RINGS;i++){
    const t=i/(SPINE_RINGS-1);
    const y=t*spH*bSc;
    const wx=Math.sin(t*5+breathPhase*1.8)*vib*t+Math.sin(t*2+now*0.0004)*0.012*wobDamp;
    const wz=Math.cos(t*4.5+breathPhase*1.4)*vib*t*0.6+Math.cos(t*1.7+now*0.0003)*0.008*wobDamp;
    spinePts[i].x=wx;spinePts[i].y=y;spinePts[i].z=wz;
  }

  /* spine mesh */
  for(let ring=0;ring<SPINE_RINGS;ring++){
    const t=ring/(SPINE_RINGS-1);
    const p=spinePts[ring];
    const radius=(0.04+loudNorm*0.04+sOnset*0.02)*(1-t*0.5)*alive;
    const glow=ss(0,0.8,t)*(0.3+sPitchConf*0.55+transientFlash*0.15);
    const c=hsl(sHue+t*25,sSat*0.9,sLit*0.65*glow);
    for(let s=0;s<SPINE_SEGS;s++){
      const a=(s/SPINE_SEGS)*Math.PI*2;
      const vi=(ring*SPINE_SEGS+s)*3;
      spPos[vi]=p.x+Math.cos(a)*radius;spPos[vi+1]=p.y;spPos[vi+2]=p.z+Math.sin(a)*radius;
      spCol[vi]=c.r*glow;spCol[vi+1]=c.g*glow;spCol[vi+2]=c.b*glow;
    }
  }
  spGeo.attributes.position.needsUpdate=true;spGeo.attributes.color.needsUpdate=true;

  /* ── core ──────────────────────────────────────────────── */
  const tip=spinePts[SPINE_RINGS-1];
  coreOrb.position.set(tip.x,tip.y,tip.z);
  const os=clamp((0.35+loudNorm*0.6+sPitchConf*0.45+transientFlash*0.25)*alive,0.06,1.8);
  coreOrb.scale.setScalar(os);
  coreOrb.material.opacity=0.15+sPitchConf*0.5+transientFlash*0.1;
  const oc=hsl(sHue-10,sSat*0.9,0.5+sPitchConf*0.15);
  coreOrb.material.color.setRGB(oc.r,oc.g,oc.b);
  coreHalo.position.copy(coreOrb.position);coreHalo.scale.setScalar(os*1.4);
  coreHalo.material.opacity=clamp(0.03+loudNorm*0.08+transientFlash*0.05,0,0.18);
  coreInner.position.copy(coreOrb.position);coreInner.scale.setScalar(os*0.45);
  coreInner.material.opacity=0.25+sPitchConf*0.35;

  pulseRing.scale.setScalar(1+(1-sOnset)*1.2+transientFlash*0.6);
  pulseRing.material.opacity=sOnset*0.3+transientFlash*0.15;

  cLight.position.set(tip.x*0.5,tip.y*0.6,tip.z+0.4);
  cLight.intensity=0.08+loudNorm*0.6+sPitchConf*0.25+transientFlash*0.15;
  cLight.color.setHSL((sHue%360)/360,sSat*0.8,0.55);

  /* ── particle stream tendrils ──────────────────────────── */
  const hasMH=A.melHist.length>0;
  const bpb=64/N_STREAMS;

  for(let si=0;si<N_STREAMS;si++){
    const st=streams[si];
    const e=sBandE[st.band];
    const pk=peakBoost[st.band];

    /* stream curve: branch from spine, reach outward with organic curvature */
    const spIdx=Math.floor(st.branchH*(SPINE_RINGS-1));
    const bp=spinePts[spIdx];

    const streamLen=Math.max(0.4, e*4.0*(1.0+loudNorm*0.8)*alive + 0.3*alive);
    const ang=st.angle+Math.sin(breathPhase*0.55+st.phase)*0.22*(0.3+sPitchConf*0.7)
             +Math.sin(now*0.00012+st.phase)*0.06*wobDamp;

    /* curvature: how much the stream bends upward/sideways */
    const curlUp=0.3+e*0.6+sPitchConf*0.2;
    const curlSide=0.15+A.vibratoDepth*0.2;

    for(let p=0;p<PPS;p++){
      const pp=st.particles[p];
      const pt=pp.t; /* 0→1 along stream */
      const gi=(si*PPS+p)*3; /* global index into buffer */

      const reach=pt*streamLen;

      /* organic curve: starts outward, bends upward, slight spiral */
      const bendUp=pt*pt*curlUp*streamLen;
      const spiral=Math.sin(pt*4.5+breathPhase*1.2+st.phase)*curlSide*pt;
      const sway=Math.sin(pt*2.8+breathPhase*0.9+pp.phaseOff)*0.1*(0.3+e);

      /* temporal flow from mel history: older history → further along tendril */
      let histMod=0;
      if(hasMH){
        const hi=Math.floor(pt*(A.melHist.length-1));
        const frame=A.melHist[clamp(hi,0,A.melHist.length-1)];
        if(frame){
          const b0=Math.floor(st.band*bpb),b1=Math.floor((st.band+1)*bpb);
          let hs=0;for(let b=b0;b<b1;b++)hs+=(frame[b]||0);
          histMod=hs/(b1-b0);
        }
      }

      const px=bp.x+Math.cos(ang+spiral)*reach+pp.jitterX*(1.0+e*3)+sway;
      const py=bp.y+bendUp+pp.jitterY*(0.8+e*2)+Math.sin(pt*3+breathPhase*0.7)*0.05*e;
      const pz=bp.z+Math.sin(ang+spiral)*reach+pp.jitterZ*(1.0+e*3);

      streamPos[gi]=px;streamPos[gi+1]=py;streamPos[gi+2]=pz;

      /* color: band color * energy, brighter near base, peak-boosted */
      const fade=(1-pt*0.4)*(0.25+e*0.75+transientFlash*0.1);
      const pkG=pk*0.4*(1-pt*0.6);
      const hMod=histMod*0.25;
      streamCol[gi]=(st.bc.r+hMod+pkG)*fade;
      streamCol[gi+1]=(st.bc.g+hMod*0.6+pkG*0.8)*fade;
      streamCol[gi+2]=(st.bc.b+hMod*0.4+pkG*0.6)*fade;

      /* size: larger near base, energy-dependent, peak-boosted */
      const baseSize=pp.sizeBase*(1-pt*0.4);
      streamSizes[si*PPS+p]=Math.max(0.015, baseSize*(0.6+e*3.0+pk*0.8+transientFlash*0.4)*alive);
    }
  }
  streamGeo.attributes.position.needsUpdate=true;
  streamGeo.attributes.color.needsUpdate=true;
  streamGeo.attributes.size.needsUpdate=true;

  /* ── ambient dust ──────────────────────────────────────── */
  const pull=loudNorm*0.2+sPitchConf*0.08;
  for(let i=0;i<AMBIENT_DUST;i++){
    adPh[i]+=dt*adSpd[i]*(1+loudNorm*0.3);
    const bi=i*3;
    const r=adRad[i]*(1-pull*0.2)+Math.sin(adPh[i]*0.25+i)*0.1;
    adPos[bi]=Math.cos(adPh[i])*r;
    adPos[bi+1]=adYB[i]*alive*bSc+Math.sin(adPh[i]*0.35+i*0.1)*0.1;
    adPos[bi+2]=Math.sin(adPh[i])*r;
    const dist=Math.sqrt(adPos[bi]**2+(adPos[bi+1]-tip.y*0.4)**2+adPos[bi+2]**2);
    const prox=clamp(1-dist/3.5,0,1);
    const sp=prox*(0.06+loudNorm*0.15+sOnset*0.1);
    const dc=hsl(sHue+(i%25),sSat*0.3,0.25);
    adCol[bi]=dc.r*sp;adCol[bi+1]=dc.g*sp;adCol[bi+2]=dc.b*sp;
  }
  adGeo.attributes.position.needsUpdate=true;adGeo.attributes.color.needsUpdate=true;

  bloom.strength=lerp(bloom.strength,0.45+sPitchConf*0.35+transientFlash*0.2+sOnset*0.08,0.07);
  bloom.radius=lerp(bloom.radius,0.78+sPitchConf*0.15,0.05);
}

/* ── overlay ─────────────────────────────────────────────── */
const eN=document.getElementById('v-note'),eF=document.getElementById('v-freq');
const eV=document.getElementById('v-vol'),eT=document.getElementById('v-timbre'),eR=document.getElementById('v-range');
function updateOverlay(){
  eN.textContent=A.note;
  eF.textContent=A.pitch?A.pitch.toFixed(1)+' Hz':'— Hz';
  const db=sLoud;eV.textContent=db.toFixed(1)+' dB';
  eV.style.color=db>-18?'#f7d089':db>-42?'#95e1c2':'#89c1f0';
  eT.textContent=A.timbre;eR.textContent=A.range;
}

/* ── WS ──────────────────────────────────────────────────── */
const dot=document.getElementById('dot');
function connect(){
  const ws=new WebSocket('ws://localhost:8765');
  ws.onopen=()=>{dot.classList.add('on')};
  ws.onclose=()=>{dot.classList.remove('on');setTimeout(connect,1500)};
  ws.onerror=()=>ws.close();
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}ingestFrame(d);updateOverlay()};
}
connect();

function resize(){
  const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h);composer.setSize(w,h);bloom.resolution.set(w,h);
}
addEventListener('resize',resize);resize();

let lt=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,(now-lt)/1000||0.016);lt=now;
  update(dt,now);
  const dr=now*0.000022;
  camera.position.x=lerp(camera.position.x,Math.sin(dr)*0.45,0.003);
  camera.position.y=lerp(camera.position.y,2.0+Math.cos(dr*0.55)*0.08,0.003);
  ctl.update();composer.render();
}
requestAnimationFrame(animate);
</script>
