<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020609}
#c{display:block}
#info{
  position:absolute;top:16px;right:16px;
  background:linear-gradient(160deg,rgba(12,22,42,0.78),rgba(6,12,28,0.72));
  border:1px solid rgba(120,180,240,0.18);border-radius:18px;padding:18px 22px;
  font-family:'Segoe UI','SF Pro Text',sans-serif;min-width:220px;pointer-events:none;
  backdrop-filter:blur(18px) saturate(130%);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
#info table{border-collapse:collapse;width:100%}
#info td{padding:5px 0}
.lbl{color:rgba(160,195,230,0.50);font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding-right:14px;white-space:nowrap}
.val{color:#e0eeff;font-size:15px;font-weight:600}
.val.big{font-size:28px;font-weight:700;color:#f0f8ff;letter-spacing:-0.5px}
#dot{position:absolute;top:16px;left:16px;width:8px;height:8px;border-radius:50%;background:#2b3645;transition:background .4s,box-shadow .4s}
#dot.on{background:#3fb950;box-shadow:0 0 10px rgba(63,185,80,.55)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <table>
    <tr><td class="lbl">Note</td><td class="val big" id="v-note">—</td></tr>
    <tr><td class="lbl">Freq</td><td class="val" id="v-freq">— Hz</td></tr>
    <tr><td class="lbl">Volume</td><td class="val" id="v-vol">— dB</td></tr>
    <tr><td class="lbl">Timbre</td><td class="val" id="v-timbre">—</td></tr>
    <tr><td class="lbl">Range</td><td class="val" id="v-range">—</td></tr>
  </table>
</div>
<div id="dot"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

const VIS={
  spine:{rings:68,segs:16,minH:2.2,maxH:4.7,baseRadius:0.07,radiusGain:0.08,nodeSharpness:0.17,nodeGain:1.6,vibratoPos:0.045,vibratoWidth:0.05},
  ribbons:{maxCount:5,minCount:2,segments:96,baseRadius:0.34,spreadGain:1.2,widthBase:0.34,widthGain:0.58,opacityBase:0.09,opacityGain:0.2,verticalTwist:0.75,flowSpeed:0.19},
  particles:{count:6800,sizeMin:0.02,sizeMax:0.07,baseAlpha:0.09,alphaGain:0.18,drift:0.22,orbital:0.6,chestSuppression:0.55},
  base:{pulseGain:0.24,chestGain:0.5,ringDecay:0.92,glowGain:0.45},
  smooth:{pitch:0.15,loud:0.12,centroid:0.1,onset:0.28,energy:0.16,harmonic:0.12,breath:0.1,node:0.15,register:0.09}
};

const A={mel:new Float32Array(64),pitch:0,loudness:-80,centroid:900,note:'—',timbre:'—',range:'—',onset:0,energy:0,pitchConf:0,peaks:[],melHist:[],pitchHist:[],loudHist:[]};
const S={pitch:210,loud:-80,centroid:900,onset:0,energy:0,pitchConf:0,pitchNorm:0.34,loudNorm:0,centroidNorm:0.45,harmonicRichness:0.2,breathiness:0.05,vibrato:0,nodeY:0.2,nodePulse:0,alive:0,chest:0,mixed:1,head:0,spineH:2.8};
let breathPhase=0,ringPulse=0,transient=0,lastNote='—';

function ingestFrame(d){
  for(let i=0;i<64;i++)A.mel[i]=clamp((d.mel&&d.mel[i])||0,0,1);
  A.pitch=d.pitch||0;A.loudness=d.loudness??-80;A.centroid=d.centroid||900;
  A.note=d.note||'—';A.timbre=d.timbre||'—';A.range=d.range||'—';
  A.onset=d.onset||0;A.energy=d.energy||0;A.pitchConf=d.pitchConf||0;A.peaks=d.peaks||[];
  A.melHist=d.melHist||[];A.pitchHist=d.pitchHist||[];A.loudHist=d.loudHist||[];

  S.pitch=lerp(S.pitch,A.pitch>40?A.pitch:S.pitch,VIS.smooth.pitch);
  S.loud=lerp(S.loud,A.loudness,VIS.smooth.loud);
  S.centroid=lerp(S.centroid,A.centroid,VIS.smooth.centroid);
  S.onset=lerp(S.onset,A.onset,VIS.smooth.onset);
  S.energy=lerp(S.energy,A.energy,VIS.smooth.energy);
  S.pitchConf=lerp(S.pitchConf,A.pitchConf,0.2);

  S.loudNorm=clamp((S.loud+58)/40,0,1);
  const p=clamp(S.pitch||120,80,1200);
  S.pitchNorm=lerp(S.pitchNorm,(Math.log(p)-Math.log(80))/(Math.log(1200)-Math.log(80)),0.14);
  S.centroidNorm=lerp(S.centroidNorm,(Math.log(clamp(S.centroid,120,4000))-Math.log(120))/(Math.log(4000)-Math.log(120)),0.1);

  let mSum=0,mSq=0;
  for(let i=0;i<64;i++){const v=A.mel[i];mSum+=v;mSq+=v*v}
  const flatness=(mSum>1e-5)?(mSq/(mSum*mSum*0.06)):0;
  const peakness=clamp((A.peaks?.length||0)/3,0,1);
  S.harmonicRichness=lerp(S.harmonicRichness,clamp(flatness*2.5+peakness*0.4,0,1),VIS.smooth.harmonic);
  S.breathiness=lerp(S.breathiness,clamp((S.onset*0.3)+(1-S.pitchConf)*0.6+(1-S.harmonicRichness)*0.2,0,1),VIS.smooth.breath);

  const hist=A.pitchHist||[];
  if(hist.length>5){
    let mean=0;for(const h of hist)mean+=h;mean/=hist.length;
    let vr=0;for(const h of hist)vr+=(h-mean)*(h-mean);vr/=hist.length;
    S.vibrato=clamp(Math.sqrt(vr)/35,0,1);
  }

  const range=(A.range||'').toLowerCase();
  const chestT=(range==='bass'||range==='chest')?1:(range==='mixed'?0.45:clamp(1-S.pitchNorm*1.6,0,1));
  const headT=(range==='head'||range==='whistle')?1:(range==='mixed'?0.45:clamp((S.pitchNorm-0.35)*1.9,0,1));
  const mixedT=clamp(1-Math.abs(chestT-headT)-0.2,0,1);
  S.chest=lerp(S.chest,chestT,VIS.smooth.register);
  S.head=lerp(S.head,headT,VIS.smooth.register);
  S.mixed=lerp(S.mixed,mixedT,VIS.smooth.register);

  if(A.onset>0.28||A.note!==lastNote){transient=1;ringPulse=Math.min(1,ringPulse+0.6);}
  lastNote=A.note;
}

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;

const scene=new THREE.Scene();scene.background=new THREE.Color(0x020609);scene.fog=new THREE.FogExp2(0x03070f,0.03);
const camera=new THREE.PerspectiveCamera(38,1,0.1,100);camera.position.set(0,2.2,5.4);
const ctl=new THREE.OrbitControls(camera,renderer.domElement);
ctl.target.set(0,1.5,0);ctl.enableDamping=true;ctl.dampingFactor=0.06;ctl.enablePan=false;
ctl.minDistance=2.5;ctl.maxDistance=10;ctl.maxPolarAngle=Math.PI*0.52;ctl.minPolarAngle=Math.PI*0.08;ctl.update();

const composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.58,0.82,0.58);composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0x09111d,0.3));
scene.add(new THREE.HemisphereLight(0x2d507f,0x03060d,0.25));
const keyLight=new THREE.PointLight(0x6c9fd4,0.38,14,2);keyLight.position.set(2.4,4.2,3.0);scene.add(keyLight);
const warmLight=new THREE.PointLight(0xcc8855,0.18,8,2);warmLight.position.set(-2.4,2,-1.2);scene.add(warmLight);
const baseGlowLight=new THREE.PointLight(0x3366bb,0.25,5,2);baseGlowLight.position.set(0,0.12,0);scene.add(baseGlowLight);

function toColor(norm,chestBias=0){
  const warm=new THREE.Color(0xe3a14a),mid=new THREE.Color(0xf4e3b5),cool=new THREE.Color(0xe4f1ff);
  const c=new THREE.Color();
  if(norm<0.55)c.copy(warm).lerp(mid,ss(0.0,0.55,norm));
  else c.copy(mid).lerp(cool,ss(0.55,1.0,norm));
  if(chestBias>0.01)c.lerp(new THREE.Color(0xc77b3b),chestBias*0.45);
  return c;
}

const groundGeo=new THREE.CircleGeometry(5,96);groundGeo.rotateX(-Math.PI/2);
const groundMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,side:THREE.DoubleSide,
  uniforms:{uTime:{value:0},uEnergy:{value:0},uLow:{value:0}},
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:`uniform float uTime,uEnergy,uLow;varying vec3 vP;
  void main(){
    float d=length(vP.xz);
    float ring=sin(d*10.0-uTime*1.2)*0.5+0.5;
    float radial=1.0-smoothstep(0.25,4.6,d);
    float inner=1.0-smoothstep(0.0,2.0,d);
    float pulse=(uEnergy*0.08 + uLow*0.09) * (0.4+ring*0.6);
    vec3 col=mix(vec3(0.05,0.1,0.2),vec3(0.12,0.18,0.32),ring*0.4+uLow*0.25);
    col+=vec3(0.14,0.09,0.03)*(uLow*0.35)*inner;
    float alpha=(0.08+pulse)*radial + inner*uLow*0.04;
    gl_FragColor=vec4(col,alpha);
  }`
});
const ground=new THREE.Mesh(groundGeo,groundMat);ground.position.y=-0.02;scene.add(ground);

(function(){const pts=[];
  for(let r=0.5;r<=4.0;r+=0.7){const segs=64;for(let i=0;i<segs;i++){
    const a0=(i/segs)*Math.PI*2,a1=((i+1)/segs)*Math.PI*2;
    pts.push(Math.cos(a0)*r,-0.015,Math.sin(a0)*r,Math.cos(a1)*r,-0.015,Math.sin(a1)*r);}}
  for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2;pts.push(Math.cos(a)*0.3,-0.015,Math.sin(a)*0.3,Math.cos(a)*4.0,-0.015,Math.sin(a)*4.0)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  scene.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x1a3050,transparent:true,opacity:0.24})));
})();

const SP=VIS.spine;
const spV=SP.rings*SP.segs;
const spPos=new Float32Array(spV*3),spCol=new Float32Array(spV*3),spPos2=new Float32Array(spV*3),spCol2=new Float32Array(spV*3);
const spIdx=[];
for(let r=0;r<SP.rings-1;r++)for(let s=0;s<SP.segs;s++){
  const a=r*SP.segs+s,b=a+SP.segs,c=r*SP.segs+((s+1)%SP.segs),d=c+SP.segs;spIdx.push(a,b,c,c,b,d);
}
function makeSpineMesh(pos,col,op){
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(spIdx);
  const m=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:op,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
  const mesh=new THREE.Mesh(g,m);scene.add(mesh);return mesh;
}
const spineOuter=makeSpineMesh(spPos,spCol,0.8),spineInner=makeSpineMesh(spPos2,spCol2,0.65);
const spinePts=Array.from({length:SP.rings},()=>({x:0,y:0,z:0}));

const coreNode=new THREE.Mesh(new THREE.SphereGeometry(0.12,26,26),new THREE.MeshBasicMaterial({transparent:true,opacity:0.72,blending:THREE.AdditiveBlending,depthWrite:false,color:0xf8eec6}));
const coreHalo=new THREE.Mesh(new THREE.SphereGeometry(0.26,24,24),new THREE.MeshBasicMaterial({transparent:true,opacity:0.14,blending:THREE.AdditiveBlending,depthWrite:false,color:0xfaf3de}));
scene.add(coreHalo);scene.add(coreNode);

const baseRing=new THREE.Mesh(new THREE.RingGeometry(0.22,0.75,64),new THREE.MeshBasicMaterial({transparent:true,opacity:0.12,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,color:0x2d5fb2}));
baseRing.rotation.x=-Math.PI/2;baseRing.position.y=0.01;scene.add(baseRing);
const pulseRing=new THREE.Mesh(new THREE.RingGeometry(0.12,0.36,64),new THREE.MeshBasicMaterial({transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,color:0x88b8f0}));
pulseRing.rotation.x=-Math.PI/2;pulseRing.position.y=0.02;scene.add(pulseRing);

const ribbonGroup=new THREE.Group();scene.add(ribbonGroup);
const ribbons=[];
for(let i=0;i<VIS.ribbons.maxCount;i++){
  const seg=VIS.ribbons.segments;
  const pos=new Float32Array((seg+1)*2*3);const col=new Float32Array((seg+1)*2*3);const idx=[];
  for(let s=0;s<seg;s++){const a=s*2,b=a+1,c=a+2,d=a+3;idx.push(a,b,c,c,b,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(idx);
  const m=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.15,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
  const mesh=new THREE.Mesh(g,m);mesh.visible=i<3;ribbonGroup.add(mesh);
  ribbons.push({mesh,pos,col,geo:g,phase:Math.random()*Math.PI*2,tilt:(Math.random()*2-1)*0.25,speed:0.7+Math.random()*0.7});
}

const P=VIS.particles;
const pPos=new Float32Array(P.count*3),pSize=new Float32Array(P.count),pAlpha=new Float32Array(P.count),pSeed=new Float32Array(P.count*4);
for(let i=0;i<P.count;i++){
  pSeed[i*4]=Math.random()*Math.PI*2;
  pSeed[i*4+1]=Math.random();
  pSeed[i*4+2]=Math.random()*2-1;
  pSeed[i*4+3]=Math.random()*2-1;
  pSize[i]=lerp(P.sizeMin,P.sizeMax,Math.random());
}
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('aSize',new THREE.BufferAttribute(pSize,1));
pGeo.setAttribute('aAlpha',new THREE.BufferAttribute(pAlpha,1));
const pMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uColor:{value:new THREE.Color(0xffeac5)}},
  vertexShader:`attribute float aSize;attribute float aAlpha;varying float vA;void main(){vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*(340.0/(-mv.z));gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform vec3 uColor;varying float vA;void main(){float d=length(gl_PointCoord-0.5)*2.0;float a=(1.0-smoothstep(0.0,1.0,d))*vA;if(a<0.002)discard;gl_FragColor=vec4(uColor*(1.2-d*0.5),a);}`
});
const particlePoints=new THREE.Points(pGeo,pMat);scene.add(particlePoints);

(function(){
  const nebFS=`uniform float uTime;varying vec2 vUv;float n(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}void main(){vec2 uv=vUv-0.5;float d=length(uv);float v=n(uv*3.0+uTime*0.02)*0.5+n(uv*7.0-uTime*0.015)*0.3;float fade=1.0-smoothstep(0.1,0.5,d);float bright=v*fade*0.03;vec3 col=mix(vec3(0.08,0.14,0.28),vec3(0.14,0.08,0.24),v);gl_FragColor=vec4(col*bright,bright);}`;
  for(let i=0;i<3;i++){
    const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:nebFS});
    const p=new THREE.Mesh(new THREE.PlaneGeometry(12,12),m);p.position.set((i-1)*3,2.5,-6-i*2);p.rotation.y=(i-1)*0.3;scene.add(p);
  }
})();

function updateSpine(now){
  S.alive=ss(0.03,0.12,S.loudNorm);
  S.spineH=lerp(S.spineH,lerp(SP.minH,SP.maxH,S.pitchNorm*0.45+S.loudNorm*0.55)*(0.85+S.alive*0.25),0.1);
  breathPhase+=(0.6+S.loudNorm*0.5+S.pitchConf*0.22)*0.016;
  const vib=Math.sin(now*0.007)*S.vibrato*SP.vibratoPos;

  const registerLift=lerp(-0.13,0.18,S.head)-S.chest*0.08;
  const targetNode=clamp(0.12+S.pitchNorm*0.76+registerLift,0.08,0.93);
  S.nodeY=lerp(S.nodeY,targetNode,VIS.smooth.node);

  const color=toColor(S.centroidNorm,S.chest);
  const coolEdge=toColor(clamp(S.centroidNorm+0.2,0,1),0);

  for(let r=0;r<SP.rings;r++){
    const t=r/(SP.rings-1);
    const y=t*S.spineH;
    const sway=vib*Math.sin(t*8+breathPhase*1.3)*(0.2+0.8*t);
    const x=Math.sin(t*1.8+breathPhase*0.7)*0.012*(1-S.pitchConf*0.5)+sway;
    const z=Math.cos(t*1.2+breathPhase*0.45)*0.008*(1-S.pitchConf*0.45);
    spinePts[r].x=x;spinePts[r].y=y;spinePts[r].z=z;

    const node=Math.exp(-Math.pow((t-S.nodeY)/SP.nodeSharpness,2));
    const lowerDensity=Math.exp(-Math.pow((t-0.28)/0.22,2))*S.chest;
    const radius=(SP.baseRadius + S.loudNorm*SP.radiusGain + lowerDensity*0.05 + node*0.04 + Math.sin(now*0.012+t*12)*S.vibrato*SP.vibratoWidth)*S.alive*(1-t*0.45);
    const glow=(0.28+S.loudNorm*0.9+node*SP.nodeGain+S.pitchConf*0.35+lowerDensity*0.5)*S.alive;
    const c1=color.clone().lerp(coolEdge,t*0.4).multiplyScalar(glow*0.68);
    const c2=color.clone().lerp(new THREE.Color(1,0.97,0.88),node*0.5).multiplyScalar(glow*0.95);

    for(let s=0;s<SP.segs;s++){
      const a=s/SP.segs*Math.PI*2,vi=(r*SP.segs+s)*3;
      const cs=Math.cos(a),sn=Math.sin(a);
      spPos[vi]=x+cs*radius;spPos[vi+1]=y;spPos[vi+2]=z+sn*radius;
      spCol[vi]=c1.r;spCol[vi+1]=c1.g;spCol[vi+2]=c1.b;
      spPos2[vi]=x+cs*radius*0.46;spPos2[vi+1]=y;spPos2[vi+2]=z+sn*radius*0.46;
      spCol2[vi]=c2.r;spCol2[vi+1]=c2.g;spCol2[vi+2]=c2.b;
    }
  }
  spineOuter.geometry.attributes.position.needsUpdate=true;spineOuter.geometry.attributes.color.needsUpdate=true;
  spineInner.geometry.attributes.position.needsUpdate=true;spineInner.geometry.attributes.color.needsUpdate=true;

  const ni=Math.floor(S.nodeY*(SP.rings-1));
  const np=spinePts[clamp(ni,0,SP.rings-1)];
  S.nodePulse=lerp(S.nodePulse,0.42+S.loudNorm*0.9+S.vibrato*0.28,0.12);
  coreNode.position.set(np.x,np.y,np.z);coreHalo.position.copy(coreNode.position);
  coreNode.scale.setScalar(clamp(S.nodePulse,0.22,1.6));coreHalo.scale.setScalar(clamp(S.nodePulse*1.75,0.4,2.6));
  const nCol=color.clone().lerp(new THREE.Color(0xfef8ec),0.45+S.head*0.2);
  coreNode.material.color.copy(nCol);coreHalo.material.color.copy(nCol);
  coreNode.material.opacity=0.38+S.loudNorm*0.33+S.pitchConf*0.2;
  coreHalo.material.opacity=0.09+S.loudNorm*0.15;
}

function updateRibbons(now){
  const R=VIS.ribbons;
  const count=Math.round(lerp(R.minCount,R.maxCount,S.harmonicRichness*0.85+S.mixed*0.2));
  const spread=R.baseRadius + S.harmonicRichness*R.spreadGain + S.chest*0.32 - S.head*0.1;
  const width=R.widthBase + S.harmonicRichness*R.widthGain + S.chest*0.25 - S.head*0.15;
  const color=toColor(S.centroidNorm,S.chest);

  for(let i=0;i<ribbons.length;i++){
    const rb=ribbons[i];rb.mesh.visible=i<count;
    if(!rb.mesh.visible)continue;
    const pos=rb.pos,col=rb.col;const seg=R.segments;
    const opacity=(R.opacityBase+S.harmonicRichness*R.opacityGain+S.chest*0.05-S.head*0.04)*(1-i*0.08);
    rb.mesh.material.opacity=clamp(opacity,0.04,0.3);

    for(let s=0;s<=seg;s++){
      const t=s/seg;
      const spineIndex=Math.floor(t*(SP.rings-1));
      const sp=spinePts[clamp(spineIndex,0,SP.rings-1)];
      const registerBias=(S.chest*0.22*(1-t)-S.head*0.14*t);
      const baseRad=spread*(0.45+0.55*Math.sin(Math.PI*t))+registerBias;
      const twist=rb.phase + now*0.001*(R.flowSpeed*rb.speed) + t*(5.2+S.harmonicRichness*3.2) + i*1.17;
      const orbit=baseRad*(0.7+0.3*Math.sin(t*9 + rb.phase));
      const px=sp.x+Math.cos(twist)*orbit;
      const pz=sp.z+Math.sin(twist)*orbit;
      const py=sp.y + Math.sin(twist*R.verticalTwist + rb.tilt + t*4)*0.05 + S.vibrato*0.03*Math.sin(t*13+rb.phase);
      const tangentA=twist+Math.PI*0.5;
      const halfW=width*(0.16+0.84*Math.sin(Math.PI*t))*(1-i*0.12);
      const dx=Math.cos(tangentA)*halfW, dz=Math.sin(tangentA)*halfW;

      const vi=(s*2)*3;
      pos[vi]=px-dx;pos[vi+1]=py;pos[vi+2]=pz-dz;
      pos[vi+3]=px+dx;pos[vi+4]=py;pos[vi+5]=pz+dz;

      const node=Math.exp(-Math.pow((t-S.nodeY)/(0.26+S.head*0.08),2));
      const c=color.clone().lerp(new THREE.Color(0xf7f0df),node*0.3+S.head*0.2).multiplyScalar((0.23+node*0.55)*(1-i*0.06));
      col[vi]=c.r;col[vi+1]=c.g;col[vi+2]=c.b;
      col[vi+3]=c.r;col[vi+4]=c.g;col[vi+5]=c.b;
    }
    rb.geo.attributes.position.needsUpdate=true;
    rb.geo.attributes.color.needsUpdate=true;
  }
}

function updateParticles(now){
  const alphaBase=(P.baseAlpha + S.breathiness*P.alphaGain + S.onset*0.08)*(1-S.chest*P.chestSuppression*0.35);
  const orbital=(P.orbital + S.harmonicRichness*0.8);
  const maxY=S.spineH*(0.95+S.head*0.12);

  for(let i=0;i<P.count;i++){
    const id=i*3,sd=i*4;
    const t=((now*0.00018 + pSeed[sd+1]*0.7 + i*0.00003)%1);
    const localY=t*maxY;
    const angle=pSeed[sd] + now*0.0007*(0.3+pSeed[sd+1]*orbital);
    const rad=(0.16 + pSeed[sd+1]*1.2)*(0.55+S.harmonicRichness*0.9+S.breathiness*0.25);
    const drift=Math.sin(now*0.0013+pSeed[sd+2]*6.28+localY*1.8)*P.drift;

    pPos[id]=Math.cos(angle)*(rad+drift*0.1);
    pPos[id+1]=localY + Math.sin(angle*1.7+now*0.001)*0.05 + (S.head*0.12-S.chest*0.08)*t;
    pPos[id+2]=Math.sin(angle)*(rad+drift*0.1);

    const nearNode=Math.exp(-Math.pow((localY/maxY-S.nodeY)/0.24,2));
    pAlpha[i]=clamp(alphaBase*(0.2+nearNode*0.9)*(0.3+S.alive*0.9)*(0.5+S.breathiness*0.7),0.0,0.24);
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.aAlpha.needsUpdate=true;
  particlePoints.visible=S.alive>0.04;
  pMat.uniforms.uColor.value.copy(toColor(S.centroidNorm,S.chest).lerp(new THREE.Color(0xe6efff),S.head*0.22));
}

function updateBase(now){
  ringPulse*=VIS.base.ringDecay;
  transient*=0.9;
  const lowWeight=clamp(S.chest*0.9 + (1-S.pitchNorm)*0.4,0,1);
  const pulse=clamp(S.loudNorm*VIS.base.pulseGain + lowWeight*VIS.base.chestGain + ringPulse*0.4,0,1);

  groundMat.uniforms.uTime.value=now*0.001;
  groundMat.uniforms.uEnergy.value=pulse;
  groundMat.uniforms.uLow.value=lowWeight;

  baseRing.scale.setScalar(1+S.loudNorm*0.55+lowWeight*0.35+ringPulse*0.3);
  baseRing.material.opacity=0.08+pulse*0.2;
  baseRing.material.color.copy(toColor(S.centroidNorm,S.chest));

  pulseRing.scale.setScalar(1+ringPulse*2.2+S.onset*0.8);
  pulseRing.material.opacity=clamp(ringPulse*0.28+S.onset*0.12,0,0.32);
  pulseRing.material.color.copy(toColor(S.centroidNorm,S.chest).lerp(new THREE.Color(0xecf4ff),0.3));

  baseGlowLight.intensity=0.12+pulse*VIS.base.glowGain;
  baseGlowLight.color.copy(toColor(S.centroidNorm,S.chest));
}

function updateVisuals(dt,now){
  updateSpine(now);
  updateRibbons(now);
  updateParticles(now);
  updateBase(now);

  bloom.strength=lerp(bloom.strength,0.42+S.loudNorm*0.4+S.onset*0.15+S.head*0.08,0.06);
  bloom.radius=lerp(bloom.radius,0.82+S.head*0.15-S.chest*0.1,0.06);
  bloom.threshold=lerp(bloom.threshold,0.58-S.loudNorm*0.09,0.07);
}

const eN=document.getElementById('v-note'),eF=document.getElementById('v-freq');
const eV=document.getElementById('v-vol'),eT=document.getElementById('v-timbre'),eR=document.getElementById('v-range');
function updateOverlay(){
  eN.textContent=A.note;eN.style.textShadow='0 0 '+(10+S.pitchConf*18)+'px rgba(130,200,255,'+(0.15+transient*0.2)+')';
  eF.textContent=A.pitch?A.pitch.toFixed(1)+' Hz':'— Hz';
  const db=S.loud;eV.textContent=db.toFixed(1)+' dB';eV.style.color=db>-18?'#f7d089':db>-42?'#95e1c2':'#89c1f0';
  eT.textContent=A.timbre;eR.textContent=A.range;
}

const dot=document.getElementById('dot');
function connect(){const ws=new WebSocket('ws://localhost:8765');
  ws.onopen=()=>dot.classList.add('on');
  ws.onclose=()=>{dot.classList.remove('on');setTimeout(connect,1500)};
  ws.onerror=()=>ws.close();
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}ingestFrame(d);updateOverlay();};
}
connect();

function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);composer.setSize(w,h);bloom.resolution.set(w,h)}
addEventListener('resize',resize);resize();

let lt=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min(0.05,(now-lt)/1000||0.016);lt=now;
  updateVisuals(dt,now);
  const drift=now*0.000018;
  camera.position.x=lerp(camera.position.x,Math.sin(drift)*0.38,0.003);
  camera.position.y=lerp(camera.position.y,2.2+Math.cos(drift*0.6)*0.055,0.003);
  ctl.update();composer.render();
}
requestAnimationFrame(animate);
</script>
